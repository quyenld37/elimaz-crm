# Ghi chú viết tay cho docs/danh-muc-dung-chung.md: "khi nào KHÔNG dùng" từng gói trong internal/platform.
# Dạng: mỗi dòng `đường/dẫn/gói: câu` (tập con của YAML, tools/catalog tự đọc). Gói mới chưa có dòng ở đây thì
# `make catalog` ghi "CẦN GHI CHÚ" và thoát khác 0.
internal/platform/commands: "Không gọi mạng ra ngoài ở chỗ khác: mọi tác động ra ngoài là một lệnh (Kind từ CommandKind) ghi bằng JobQueue.Enqueue trong transaction nghiệp vụ, Handler.Execute gửi. Không trả StatusNotSent khi chưa chắc bên ngoài chưa nhận (lỗi, quá giờ → in_doubt). Không tự gửi lại lệnh in_doubt: chỉ ResolveInDoubt (Looker nói chắc chắn chưa có) hoặc người có quyền chạy lại. Lệnh không đụng database thì không cần commands; việc chỉ đụng database là Handler transactional của queue."
internal/platform/config: "Không đọc biến môi trường ở gói khác (linter chặn os.Getenv); không thêm cấu hình nghiệp vụ thay đổi lúc chạy (cái đó nằm trong database). Truyền Config đã kiểm vào hàm khởi tạo."
internal/platform/logging: "Không tự dựng slog.Handler khác hay ghi thẳng ra stdout; không dựa vào che theo tên khóa cho nội dung tự do (chuỗi trong thông điệp không bị che): dữ liệu cá nhân đi bằng kiểu Phone, Address, Secret hoặc khóa có tên đúng."
internal/platform/observability: "Không đặt kiểm tra nghiệp vụ hay dữ liệu khách vào /health/*; kiểm sâu (/health/deep, cần token) thuộc Task 19."
internal/platform/telemetry: "Không tự tạo TracerProvider hay exporter ở gói khác; không gắn SĐT, địa chỉ, nội dung tin, token vào thuộc tính span. Gọi Setup một lần trong cmd/crm."
internal/platform/db: "Không mở transaction bằng Begin/BeginTx/pgx.BeginFunc ở gói khác (txusage_test chặn) và không tự viết vòng thử lại: dùng RetryTx (hoặc tenancy.WithTenant từ Task 5). Hàm trong RetryTx không gọi mạng, không cộng dồn vào biến bên ngoài vì có thể chạy tới 4 lần. Không gọi Migrate ngoài vai trò migrate; không mở pool thứ hai cho cùng vai trò."
internal/platform/metrics: "Không mở endpoint /metrics hay thêm thư viện chỉ số (ADR C6); không tạo Registry thứ hai trong một tiến trình (cmd/crm tạo một cái và truyền xuống). Không đặt đường dẫn thật, tham số, SĐT hay mã khách vào tên hoặc nhãn chỉ số (nhãn route dùng mẫu của ServeMux). Không dùng Flusher cho dữ liệu nghiệp vụ hay số phải chính xác tuyệt đối: lỗi commit không rõ kết quả có thể ghi một lô hai lần."
internal/platform/tenancy: "Không tự đặt app.tenant_id bằng set_config hay SET (kể cả SET LOCAL) ở gói khác: dùng WithTenant. Không dùng Resolve, ListTenantIDs để đọc dữ liệu nghiệp vụ (chỉ là bảng định tuyến). Không gọi CheckSchemaRules bằng crm_app (cần chủ bảng, chỉ dùng trong test và cổng kiểm). Bảng mới bật RLS bằng platform.enable_tenant_rls, không viết policy tay."
internal/platform/idempotency: "Không gọi Acquire hay Claim.Complete trực tiếp từ handler: route ghi dùng httpapi.WriteTx (middleware đã ghi nhận khóa). Complete phải là câu cuối của transaction nghiệp vụ (ADR-46 nhóm 13), không gọi ngoài transaction đó. Không dùng thay khóa nghiệp vụ unique (orders.idempotency_key, jobs.dedupe_key): khóa yêu cầu không chặn hai khóa khác nhau cho cùng một việc. Không lưu bí mật trả một lần: route đó khai x-idempotency: no-replay."
internal/platform/queue: "Không viết SQL lên platform.jobs ở gói khác (ngoại lệ duy nhất: việc dọn của schedules xóa việc done/expired quá 30 ngày): ghi việc bằng JobQueue.Enqueue trong transaction của dữ liệu, xử lý bằng Handler. Handler transactional không gọi mạng, không gửi gì ra ngoài (lệnh ra ngoài là commands, Task 12) và phải chạy lại được (có thể bị gọi lại). Không đặt nội dung hay dữ liệu cá nhân vào Payload, DedupeKey, OrderKey hay chuỗi lỗi: chỉ mã bản ghi. Không dùng hàng đợi cho việc cần nguyên tử với dữ liệu (cái đó nằm trong cùng một transaction), không tạo Worker thứ hai trong một tiến trình."
internal/platform/events: "Không gọi Emit ngoài transaction nghiệp vụ (tx phải là WithTenant của Event.TenantID) và không lấy Seq từ bộ đếm riêng hay giờ: Seq là cột version của đối tượng, tăng dưới khóa dòng. Không dùng sự kiện cho việc cần nguyên tử với dữ liệu (cái đó nằm trong cùng transaction) hay cho lệnh ra ngoài (commands). Consumer không gọi mạng, phải chạy lại được; Payload chỉ mang mã bản ghi. Không đổi Name của consumer đã chạy (mất tiến độ, thứ tự)."
internal/platform/schedules: "Không tự viết vòng lặp time.Ticker để chạy việc định kỳ trong tiến trình: Define một lịch và đăng ký handler của Kind ở worker. Không dùng lịch cho việc cần chạy đúng giờ tuyệt đối (Ticker hỏi mỗi 5 s, lịch trễ chỉ chạy kỳ mới nhất). Hàm dọn của bảng có RLS đăng ký bằng RegisterTenantCleanup (RegisterCleanup chạy ngoài ngữ cảnh tenant nên thấy 0 dòng); câu xóa theo lô, FOR UPDATE SKIP LOCKED."
internal/platform/webhooks: "Không nhận webhook ở vai trò khác ingest hay bằng handler tự viết: thêm một Source (VerifySignature trên thân gốc, Challenge, Split) vào IngestOptions.Sources. Không đọc, sửa platform.webhook_deliveries ở gói khác (bảng không RLS, không tenant: xử lý nghiệp vụ đi qua việc webhook.split chỉ mang deliveryId). Không log hay đưa thân, header vào chỉ số, dấu vết; không xóa tệp tạm bằng tay khi database còn lỗi."
internal/platform/selftest: "Chỉ để thử đường vào khi chưa có kênh thật: không dùng làm mẫu xác thực cho nguồn thật (mỗi kênh tự hiện thực webhooks.Source theo cách ký của nhà cung cấp) và không định tuyến sự kiện ping vào nghiệp vụ."
internal/queries: "Không ghi dữ liệu và không đặt nghiệp vụ ở đây: chỉ ghép view _v đã công bố (docs/views.md) cho màn danh sách. Không đọc bảng (không có _v), không nhập internal/modules/**; đọc một module duy nhất thì dùng public API của module đó. Câu dựng lúc chạy chỉ trong *_dynsql.go."
internal/platform/files: "Không gọi aws-sdk-go-v2 hay viết SQL lên platform.files, file_variants ở chỗ khác: dùng FileStore và các hàm của gói. Không gọi FileStore có mạng (Head, Put, Open, CopyIfAbsent, Delete) trong transaction (ADR-46): Put trước rồi Register, Head trước rồi ApplyUpload. Không tự đặt khóa kho từ tên tệp người dùng (dùng TmpKey, ServerKey…), không ký đường dẫn tới tệp khi chưa qua DownloadURL (kiểm ready, tenant, hạn) và quyền của mốc mình. Mục đích mới: một dòng INSERT trong migration của mốc cộng RegisterPurpose trong cmd/crm; ảnh riêng tư (mode private) không đi Register."
