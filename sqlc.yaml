# sqlc v1.31.1 (tools/versions.mk). Kế hoạch M0 bản 5, Task 4.
# Mỗi gói một khối: queries/<gói> → internal/<…>/internal/store. `make gen` sinh mã (không cần database);
# `make sqlc-vet` chuẩn bị từng câu trên PostgreSQL 18 đã migrate (luật sqlc/db-prepare), qua CRM_SQLC_DATABASE_URL.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries/platform
    database:
      uri: ${CRM_SQLC_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: store
        out: internal/platform/internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: migrations
    queries: queries/identity
    database:
      uri: ${CRM_SQLC_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: store
        out: internal/modules/identity/internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: migrations
    queries: queries/catalog
    database:
      uri: ${CRM_SQLC_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: store
        out: internal/modules/catalog/internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - column: catalog.variants.cost_price
            go_type:
              type: int64
              pointer: true
            nullable: true
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
            nullable: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: migrations
    queries: queries/inventory
    database:
      uri: ${CRM_SQLC_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: store
        out: internal/modules/inventory/internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
