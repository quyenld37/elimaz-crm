# golangci-lint v2.15.0 (tools/versions.mk). Kế hoạch M0 bản 5, Task 3: liệt kê tường minh, không dùng danh sách
# `standard`. Ngưỡng có dấu [P] chỉnh sau lần đo ở Task 23. Chạy trong hook Stop và trong `make ci`.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gocritic
    - errorlint
    - wrapcheck
    - containedctx
    - contextcheck
    - noctx
    - gochecknoglobals
    - gochecknoinits
    - ireturn
    - interfacebloat
    - sloglint
    - depguard
    - forbidigo
    - exhaustive
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - funlen
    - gocognit
    - dupl
    - gosec
    - nolintlint

  settings:
    funlen:
      lines: 80 # [P]
      statements: 50 # [P]
    gocognit:
      min-complexity: 20 # [P]
    dupl:
      threshold: 150
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: "[chỉ-cmd] ghi log bằng log/slog; fmt.Print* chỉ được dùng trong cmd/"
        - pattern: ^log\..*$
          pkg: ^log$
          msg: "[chỉ-cmd] dùng log/slog; gói log chuẩn chỉ được dùng trong cmd/"
        - pattern: ^os\.Getenv$
          pkg: ^os$
          msg: "[chỉ-config] đọc biến môi trường chỉ trong internal/platform/config"
        - pattern: ^http\.DefaultClient$
          pkg: ^net/http$
          msg: "tạo http.Client có Timeout; không dùng http.DefaultClient"
        - pattern: ^pgx\.QueryExecModeSimpleProtocol$
          pkg: ^github.com/jackc/pgx/v5$
          msg: "cấm simple protocol của pgx (Global Constraints)"
    depguard:
      rules:
        internal:
          files:
            - "**/internal/**"
          deny:
            - pkg: database/sql
              desc: "dùng pgx v5 (ADR-44)"
            - pkg: github.com/lib/pq
              desc: "dùng pgx v5 (ADR-44)"
            - pkg: github.com/pkg/errors
              desc: "dùng errors và fmt.Errorf %w chuẩn"
            - pkg: io/ioutil
              desc: "gói đã ngừng dùng; dùng io và os"
    exhaustive:
      # Một nhánh default tường minh là đủ (switch trên reflect.Kind, slog.Kind có nhiều giá trị không cần xử lý riêng).
      default-signifies-exhaustive: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(

  exclusions:
    generated: strict
    rules:
      # fmt.Print* và gói log chuẩn được phép trong cmd/ (in ra stderr trước khi có logger).
      - path: ^cmd/
        linters: [forbidigo]
        text: "chỉ-cmd"
      # Chỉ internal/platform/config đọc biến môi trường; test được đọc biến của môi trường test.
      - path: ^internal/platform/config/
        linters: [forbidigo]
        text: "chỉ-config"
      - path: _test\.go$
        linters: [forbidigo]
        text: "chỉ-config"
      # Test dựng tiến trình con, đọc tệp tạm và dùng chuỗi kết nối giả: G101, G204, G304 chỉ là tiếng ồn ở đây.
      - path: _test\.go$
        linters: [gosec]
        text: "G101|G204|G304"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(elimaz.com.vn/crm)
  exclusions:
    generated: strict
