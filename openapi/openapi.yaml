# Hợp đồng API của CRM (kế hoạch M0 bản 5, Task 6). Đây là nguồn: mã máy chủ (ogen, internal/httpapi/gen), bảng
# route (tools/routegen -> internal/httpapi/routes_gen.go) và client của màn hình đều sinh từ tệp này (`make gen`).
# Luật: .claude/rules/openapi.md. Mỗi operation có đúng một trong `x-permission` hoặc `x-public: true`; mọi operation
# ghi có tham số IdempotencyKey. Thay đổi phá vỡ cần dòng trong openapi/breaking-approved.yaml (`make oasdiff`).
openapi: 3.0.3
info:
  title: CRM ELIMAZ
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Tiến trình còn sống
      x-public: true
      responses:
        "200":
          description: Còn sống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      summary: Sẵn sàng nhận yêu cầu (database trả lời trong 1 s)
      x-public: true
      responses:
        "200":
          description: Sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database không trả lời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/deep:
    get:
      operationId: healthDeep
      summary: Kiểm sâu cho dịch vụ canh ngoài (Bearer HEALTH_TOKEN, Task 20); không có dữ liệu khách
      x-public: true
      responses:
        "200":
          description: Mọi chỉ số trong ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        "503":
          description: Có chỉ số quá ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/audit-logs:
    get:
      operationId: listAuditLogs
      summary: Nhật ký thao tác của shop, mới nhất trước, 50 dòng mỗi trang (Task 457)
      description: |
        Lọc theo hành động, người làm (mã nhân viên hay mã khóa dịch vụ), loại thực thể, thực thể (cần entityType), khoảng
        giờ [from, to). Trả người làm (loại, mã, tên nhân viên hay tên khóa dịch vụ), hành động, thực thể, tên các trường
        đổi; không bao giờ trả giá trị trước/sau hay IP. Con trỏ hỏng, entityId thiếu entityType, from không trước to →
        400 invalid_input.
      x-permission: audit.read
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: entityType
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: entityId
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Một trang nhật ký thao tác
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/audit-actors:
    get:
      operationId: listAuditActors
      summary: Người làm cho ô lọc của nhật ký thao tác — mọi nhân viên và khóa dịch vụ của shop (Task 488)
      description: |
        Nhân viên (mọi trạng thái, kể cả đã khóa) và khóa dịch vụ (kể cả đã thu hồi) của shop, xếp theo tên; id là mã gửi
        lại ở tham số actorId của listAuditLogs. Chỉ tên, không email. Hệ thống không có trong danh sách (không có mã).
      x-permission: audit.read
      responses:
        "200":
          description: Người làm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditActorList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users:
    get:
      operationId: listStaff
      summary: Mọi nhân viên của shop kèm vai trò theo phạm vi
      x-permission: identity.users.manage
      responses:
        "200":
          description: Nhân viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaff
      summary: Tạo nhân viên mới (chưa có vai trò nào)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: Nhân viên vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/grants:
    put:
      operationId: replaceStaffGrants
      summary: Thay toàn bộ vai trò theo phạm vi của một nhân viên (không tự sửa mình, không vượt quyền của mình)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGrantsRequest"
      responses:
        "200":
          description: Nhân viên sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/lock:
    post:
      operationId: lockStaff
      summary: Khóa nhân viên (không khóa Chủ còn hoạt động cuối cùng)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/unlock:
    post:
      operationId: unlockStaff
      summary: Mở khóa nhân viên
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi mở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles:
    get:
      operationId: listRoles
      summary: Vai trò của shop và quyền của từng vai trò
      x-permission: identity.users.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRole
      summary: Tạo vai trò tự định nghĩa từ danh sách quyền có sẵn (người tạo phải có mọi quyền đó ở toàn shop)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Vai trò vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/manage:
    get:
      operationId: listRolesToManage
      summary: Vai trò của shop cho màn Vai trò (cùng dữ liệu listRoles, chỉ cần quyền quản lý vai trò)
      x-permission: identity.roles.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/{id}:
    put:
      operationId: updateRole
      summary: Sửa tên và quyền của vai trò (không sửa được vai trò Chủ; quyền thêm hay gỡ phải có ở toàn shop)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Vai trò sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/{id}/archive:
    post:
      operationId: archiveRole
      summary: Lưu trữ vai trò không còn nhân viên đang hoạt động nào giữ (không lưu trữ được vai trò Chủ)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRoleRequest"
      responses:
        "200":
          description: Vai trò sau khi lưu trữ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/permissions:
    get:
      operationId: listPermissions
      summary: Mọi quyền của CRM kèm nhóm, nhãn tiếng Việt và loại phạm vi (để soạn vai trò)
      x-permission: identity.roles.manage
      responses:
        "200":
          description: Quyền, theo thứ tự của bảng quyền
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/service-keys:
    get:
      operationId: listServiceKeys
      summary: Khóa dịch vụ của website (không bao giờ kèm bí mật hay băm)
      x-permission: identity.service_keys.manage
      responses:
        "200":
          description: Khóa, cũ trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createServiceKey
      summary: Tạo khóa dịch vụ cho website với các quyền web.*; khóa đầy đủ chỉ có trong câu trả lời này
      description: >-
        Gửi lại cùng Idempotency-Key → 409 already_processed (không tạo khóa thứ hai, không trả lại bí mật).
        Quyền ngoài web.* → 422 permission_not_allowed_for_key.
      x-permission: identity.service_keys.manage
      x-idempotency: no-replay
      x-idempotency-reason: "Trả bí mật của khóa đúng một lần"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceKeyRequest"
      responses:
        "201":
          description: Khóa vừa tạo kèm bí mật (secret), hiện một lần
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedServiceKey"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/service-keys/{id}/revoke:
    post:
      operationId: revokeServiceKey
      summary: Thu hồi khóa dịch vụ (yêu cầu kế tiếp dùng khóa nhận 401 trong vài giây)
      x-permission: identity.service_keys.manage
      parameters:
        - $ref: "#/components/parameters/ServiceKeyID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeServiceKeyRequest"
      responses:
        "200":
          description: Khóa sau khi thu hồi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceKey"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Người dùng đang đăng nhập và quyền của họ
      description: Chỉ cần đăng nhập và tài khoản không bị khóa (Task 315); nhân viên chưa có grant nhận grants rỗng.
      x-authenticated: true
      responses:
        "200":
          description: Người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/stream:
    get:
      operationId: stream
      summary: Báo hiệu thay đổi qua SSE (handler SSE riêng, Task 16)
      x-permission: realtime.subscribe
      responses:
        "200":
          description: Luồng sự kiện
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/uploads:
    post:
      operationId: createUpload
      summary: Xin đường dẫn ký sẵn để trình duyệt tải thẳng một tệp lên kho (chỉ mục đích nhận tải lên)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Tệp chờ tải lên và đường dẫn PUT ký sẵn (hạn 15 phút)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/complete:
    post:
      operationId: completeUpload
      summary: Báo đã tải xong; máy chủ kiểm kho rồi chuyển tệp sang uploaded (ảnh thì xếp việc xử lý)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tệp sau khi kiểm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Trạng thái tệp và các biến thể ảnh công khai
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Tệp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/regenerate:
    post:
      operationId: regenerateImages
      summary: Tạo lại kích thước ảnh từ ảnh gốc theo một bộ kích thước (một lệnh mỗi tệp ảnh ready chưa có bản đó; ảnh riêng tư không áp dụng)
      x-permission: platform.files.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateImagesRequest"
      responses:
        "200":
          description: Số lệnh mới xếp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateImagesResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/verify:
    post:
      operationId: verifyFiles
      summary: Kiểm lại mọi tệp ready trên kho tệp (lệnh file.verify nền, một lệnh mỗi tenant); tệp thiếu đối tượng thành lost
      x-permission: platform.files.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Đã nhận; việc chạy nền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyFilesAccepted"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/lost:
    get:
      operationId: listLostFiles
      summary: Tệp có trong CRM nhưng kho tệp không còn (status lost), mất gần nhất trước; trang theo con trỏ
      x-permission: platform.files.manage
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Trang tệp mất
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LostFilePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs:
    get:
      operationId: listJobs
      summary: Việc nền cần người xử lý của tenant người gọi (không có payload)
      x-permission: platform.jobs.manage
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [dead, in_doubt, expired]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Danh sách việc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Đưa việc dead, in_doubt hoặc expired về pending
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/abandon:
    post:
      operationId: abandonJob
      summary: Bỏ việc (chuyển sang expired)
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Tình trạng tiến trình, hàng đợi, sao lưu, lỗi và cảnh báo 24 giờ
      x-permission: platform.health.read
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: Danh sách mẫu (chưa xóa) của người bán, sửa gần nhất trước; lọc trạng thái, danh mục (gồm con), nhãn, tìm theo mã mẫu, SKU, barcode, tên không dấu; trang theo con trỏ
      description: >-
        warehouseId (không bắt buộc) thêm cột available (tổng có thể bán của các biến thể ở kho đó, có thể âm); cần
        thêm quyền inventory.read ở kho đó, không có → 403. Mẫu khớp q tối đa 1.000.
      x-permission: catalog.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              $ref: "#/components/schemas/ProductStatus"
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Một trang mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      summary: Tạo mẫu sản phẩm kèm biến thể màu/size (barcode để trống thì CRM tự sinh EAN-13)
      x-permission: catalog.manage
      parameters:
