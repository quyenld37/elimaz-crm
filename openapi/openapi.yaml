    post:
      operationId: applyCatalogImport
      summary: Áp bản nhập ready (ghi tất cả hoặc không); việc chạy nền
      description: >-
        Chuyển bản nhập ready sang applying khi version còn khớp và xếp việc catalog.import.apply. Việc khóa và kiểm lại
        plan với dữ liệu hiện tại rồi ghi mọi mẫu, biến thể, phân loại trong một transaction: xong → applied; dữ liệu
        đổi từ lúc kiểm (SKU vừa bị mẫu khác lấy…) → failed với lỗi từng dòng, không ghi gì; tệp cùng nội dung vừa được
        áp → duplicate. Đọc kết quả bằng getCatalogImport. Bản nhập không ở ready → 409 import_not_ready; version cũ →
        409 version_conflict.
      x-permission: catalog.import
      parameters:
        - $ref: "#/components/parameters/ImportID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
