          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        depth:
          type: integer
          format: int32
        position:
          type: integer
          format: int32
    WebAttribute:
      type: object
      required: [id, code, name, position, values]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        position:
          type: integer
          format: int32
        values:
          type: array
          items:
            $ref: "#/components/schemas/WebAttributeValue"
    WebAttributeValue:
      type: object
      required: [id, value, position]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string
        position:
          type: integer
          format: int32
    WebTag:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
