        khi 0 < giá < niêm yết; nhiều chiến dịch → giá thấp nhất, hòa thì id nhỏ hơn; bảng mẫu
        testdata/contracts/web-campaign-rounding.json); báo giá, tạo đơn CRM tính lại. Không có nháp, tạm dừng, đã
        xóa. Bộ đệm 30 s, làm mới sớm hơn theo sự kiện promotion.web_campaign.changed.
