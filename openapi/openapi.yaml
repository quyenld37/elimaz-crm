          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: Mã mẫu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCatalogChanges"
        default:
          $ref: "#/components/responses/Error"
