      description: |
        Tìm khách theo SĐT (chưa có → tạo khách mới có SĐT này). Khách đã có hồ sơ sinh nhật → không đổi gì, created
        false kèm ngày đã lưu. mail true cần email. Ngày không có trong tháng, email sai → 400 invalid_input; SĐT sai →
