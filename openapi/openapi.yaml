        quay lại; lỗi lần 3 → không vào outbox nữa (không retryAt), vẫn ở "Cần nhắn" cho nhân viên. Quà đã trao hay đã
        dùng → không đổi gì (given true). Mã không phải quà sinh nhật hay không có → 404 not_found.
