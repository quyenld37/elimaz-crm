  /api/v1/web/quote:
    post:
      operationId: webQuote
      summary: Báo giá giỏ website theo số của CRM (giá, ngừng bán, còn hàng, chiến dịch web, mã giảm); không ghi gì
      description: |
        Task 192 (M5-09). Giá niêm yết đọc PostgreSQL (không qua bộ đệm); biến thể thiếu, ngừng bán, của người bán khác
        → problem unavailable (không tính vào tổng); có thể bán ở kho mặc định < qty → out_of_stock (không giữ hàng);
        quotedUnitPrice khác giá CRM → price_changed, changed = true. Chiến dịch web đang chạy CRM tự tìm (QĐ33; luật
        làm tròn testdata/contracts/web-campaign-rounding.json); dòng thuộc chiến dịch không cho dùng mã không vào nền
        tính mã (QĐ29). Mã kiểm như lúc tạo đơn trừ lượt mỗi khách (tạo đơn kiểm). fingerprint là sha256 của các dòng
        theo số CRM, phí, tổng, mã: website gửi lại khi tạo đơn. Tổng vượt 9007199254740991 → 422 total_overflow.
      x-auth: service_key
      x-permission: web.orders.create
      x-idempotency: exempt
      x-idempotency-reason: "Chỉ tính giá từ thân yêu cầu, không ghi dữ liệu"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebQuoteRequest"
      responses:
        "200":
          description: Báo giá, dòng cùng thứ tự với yêu cầu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebQuote"
        default:
          $ref: "#/components/responses/Error"
