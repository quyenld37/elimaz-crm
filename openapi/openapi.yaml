        Tối đa 8 banner (422 too_many_banners). Trường không thuộc loại bị bỏ (như admin cũ). Ảnh là mã tệp tải lên bằng
        createUpload mục đích web_banner (JPEG, PNG, WebP ≤ 8 MiB, rộng ≥ 600 px); ảnh bị từ chối → 422 file_rejected,
        không có, đã xóa, sai mục đích → 422 banner_image_invalid; ảnh đang xử lý vẫn lưu được (banner ẩn tới khi xong).
        Ghim ≤ 3 mẫu đang bán thuộc nguồn của banner (chiến dịch, danh mục và danh mục con).
      x-permission: content.manage
