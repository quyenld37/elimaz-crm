        điều khoản và SĐT → trả lô cũ, created false; đã có mà khác → 422 batch_conflict. Có boundPhones (đúng quantity
        SĐT khác nhau) → mỗi mã gắn một SĐT, codes theo đúng thứ tự boundPhones; không có → codes theo thứ tự chữ.
