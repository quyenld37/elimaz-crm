      description: |
        Ảnh: ready → url ký có hạn 10 phút tới biến thể JPEG lớn nhất trên bucket riêng tư (đã bỏ EXIF); đang xử lý →
        status processing, không url; imager từ chối (không phải ảnh) → status rejected, không url.
      x-permission: order.requests.read
