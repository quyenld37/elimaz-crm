  /api/v1/web/catalog/products:
    get:
      operationId: webCatalogProducts
      summary: Mẫu cho website theo trang (cursor, limit ≤ 200) hoặc theo danh sách mã (ids ≤ 100); có ETag
      description: |
        Task 190 (M5-07). Chỉ mẫu chưa xóa của người bán đang hoạt động; mọi trạng thái (draft, active, discontinued)
        để website tự ẩn. Mã trong ids không có trong kết quả là mẫu đã xóa, của người bán ngừng hay không có: website
        gỡ khỏi bản sao. Không có giá nhập. Gửi cả cursor lẫn ids → 400. Bộ đệm 60 s, làm mới theo sự kiện sản phẩm.
      x-auth: service_key
      x-permission: web.catalog.read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 200
        - name: ids
          in: query
          required: false
          description: Mã mẫu, phân tách bằng dấu phẩy (tối đa 100)
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Trang mẫu
          headers:
            ETag:
              description: sha256 của thân câu trả lời
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebProductPage"
        "304":
          description: If-None-Match khớp ETag hiện tại; thân rỗng
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/catalog/changes:
    get:
      operationId: webCatalogChanges
      summary: Mã mẫu có mẫu, biến thể hay tồn đổi từ mốc since (≤ 1.000 mã); không đệm
      description: |
        Task 190 (M5-07). Lần sau gửi since = until − 30 s và bỏ mã trùng. hasMore = true (đủ limit mã) thì còn thay
        đổi chưa trả: gọi tiếp với since = until − 30 s; nếu vẫn đủ limit mà until không tiến, website tải lại cả danh
        mục theo trang. serverTime (Task 489) là giờ máy chủ lúc đọc: bản sao đầu gọi changes lấy serverTime trước khi
        tải cả danh mục, rồi đồng bộ từ since = serverTime − 30 s.
      x-auth: service_key
      x-permission: web.catalog.read
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: Mã mẫu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCatalogChanges"
        default:
          $ref: "#/components/responses/Error"
