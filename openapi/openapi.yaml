          type: string
          enum: [too_heavy, busy, forbidden, error]
          description: Chỉ khi status = failed
        params:
          $ref: "#/components/schemas/ReportParams"
        rowCount:
          type: integer
          format: int32
          minimum: 0
        truncated:
          type: boolean
          description: Tệp đã cắt ở REPORT_MAX_ROWS dòng
        result:
          type: object
          additionalProperties: {}
          description: Kết quả (cùng hình dạng với GET của báo cáo, status ready); chỉ ở getXReportRun khi format json đã xong
        createdAt:
          type: string
          format: date-time
