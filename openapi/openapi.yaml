  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Lên đơn (M1, mở rộng ở M2) — tạo khách mới hoặc dùng khách có sẵn, đơn và giữ hàng cùng transaction
      description: >-
        Thân kiểu M1 (không intent, có customer.fullName, shipAddress name/phone/line) tạo thẳng đơn Đã xác nhận như
        M1. Trường M2 (customerId, intent, giảm giá, mã, nguồn, ghi chú hãng, người phụ trách, mã tỉnh/xã…) có nghiệp vụ
        từ Task M2-16, M2-17. Đúng một trong customerId, customer (sai →
        400 invalid_input). Khóa nghiệp vụ của đơn dựng từ Idempotency-Key và nhân viên (Q-T57-4); cùng khóa nghiệp vụ,
        cùng nội dung sau khi bản ghi chống trùng hết hạn → 200 trả đơn đã có. Kho giữ hàng (warehouseId, bỏ trống là
        kho chính) ngoài phạm vi order.create của người gọi → 403 forbidden, không lưu theo khóa (Task 411).
      x-permission: order.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Đơn đã tạo trước đó với cùng khóa nghiệp vụ, cùng nội dung (gửi lại)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "201":
          description: Đơn vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listOrders
      summary: 'Danh sách đơn, mới nhất trước, keyset; lọc theo nhãn, trạng thái, nguồn, người phụ trách, khách (cả nhóm), ngày, q (Task M2-24)'
      x-permission: order.read
      parameters:
        - name: label
          in: query
          required: false
          description: 'Nhãn gộp (lặp tham số cho nhiều nhãn); nhãn của vận đơn lọc được từ M3'
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/OrderLabel"
          explode: true
        - name: status
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/OrderStatus"
          explode: true
        - name: pendingReason
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/PendingReason"
          explode: true
        - name: channel
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/OrderChannel"
          explode: true
        - name: trafficSourceId
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
          explode: true
        - name: careBy
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          required: false
          description: 'Cả nhóm gốc của khách'
          schema:
            type: string
            format: uuid
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: 'Mã đơn DH…, SĐT người nhận (đủ hay đuôi) hoặc tên khách; không ghi vào log'
          schema:
            type: string
            maxLength: 100
        - name: duplicateSuspect
          in: query
          required: false
          schema:
            type: boolean
        - name: carrierKey
          in: query
          required: false
          description: 'Hãng của vận đơn hiện hành (M3, Task M3-28)'
          schema:
            type: string
            maxLength: 32
        - name: shipmentStatus
          in: query
          required: false
          description: 'Trạng thái vận đơn hiện hành (M3, Task M3-28)'
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/ShipmentStatus"
          explode: true
        - name: codState
          in: query
          required: false
          description: 'collecting = còn phải thu; holding = hãng đang giữ; received = shop đã nhận; none = không có COD (M3, Task M3-28)'
          schema:
            type: string
            enum: [collecting, holding, received, none]
        - name: packingStatus
          in: query
          required: false
          description: 'Trạng thái đóng gói (M3, Task M3-28)'
          schema:
            type: string
            enum: [none, picking, packed]
        - name: warehouseId
          in: query
          required: false
          description: 'Kho của đơn (màn Đóng gói, Task M3-45)'
          schema:
            type: string
            format: uuid
        - name: labelPrinted
          in: query
          required: false
          description: 'true = vận đơn hiện hành đã in nhãn; false = có vận đơn hiện hành, chưa in nhãn (Task M3-45)'
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: listOrders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        default:
          $ref: "#/components/responses/Error"
