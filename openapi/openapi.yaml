      operationId: updateCoupon
      summary: 'Sửa mã khi version còn khớp; mã đã dùng chỉ đổi tên, hạn cuối, số lượt tối đa, trạng thái (409 coupon_locked_after_use) (Task M2-14)'
      description: Chưa làm ở Task M2-02 (trả 501 not_implemented) cho tới task ghi trong summary.
      x-permission: promotion.manage
      parameters:
        - $ref: "#/components/parameters/CouponID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCouponRequest"
      responses:
        "200":
          description: updateCoupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/coupon-batches:
    post:
      operationId: createCouponBatch
      summary: 'Tạo đợt mã: quantity mã dùng một lần, hoặc mỗi SĐT trong boundPhones một mã gắn SĐT đó (Task M2-14)'
      description: Chưa làm ở Task M2-02 (trả 501 not_implemented) cho tới task ghi trong summary.
      x-permission: promotion.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponBatchRequest"
      responses:
        "201":
          description: createCouponBatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponBatch"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/coupon-batches/{batchId}:
    get:
      operationId: getCouponBatch
      summary: 'Một đợt mã (Task M2-14)'
      description: Chưa làm ở Task M2-02 (trả 501 not_implemented) cho tới task ghi trong summary.
      x-permission: promotion.read
      parameters:
        - $ref: "#/components/parameters/CouponBatchID"
      responses:
        "200":
          description: getCouponBatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponBatch"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/coupons/{couponId}/redemptions:
    get:
      operationId: listCouponRedemptions
      summary: 'Lượt dùng của một mã: mã đơn, số giảm, trạng thái; không SĐT (Task M2-14)'
      description: Chưa làm ở Task M2-02 (trả 501 not_implemented) cho tới task ghi trong summary.
      x-permission: promotion.read
      parameters:
        - $ref: "#/components/parameters/CouponID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: listCouponRedemptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponRedemptionPage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/coupon-check:
    get:
      operationId: checkCoupon
      summary: 'Kiểm mã cho form lên đơn: số giảm, lý do từ chối, lượt còn; không đổi lượt dùng (Task M2-14)'
      description: Chưa làm ở Task M2-02 (trả 501 not_implemented) cho tới task ghi trong summary.
      x-permission: order.create
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: base
          in: query
          required: true
          description: 'Tạm tính sau giảm dòng và giảm tay cấp đơn'
          schema:
            $ref: "#/components/schemas/Money"
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: phone
          in: query
          required: false
          description: 'Không ghi vào log'
          schema:
            $ref: "#/components/schemas/PhoneInput"
        - name: channel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderChannel"
      responses:
        "200":
          description: checkCoupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponCheck"
        default:
          $ref: "#/components/responses/Error"
components:
