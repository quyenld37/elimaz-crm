        group:
          type: string
        label:
          type: string
    CreateCatalogImportRequest:
      type: object
      additionalProperties: false
      required: [fileId]
      properties:
        fileId:
          type: string
          format: uuid
          description: Tệp .xlsx đã tải lên bằng createUpload (purpose catalog_import) và completeUpload
    CatalogImport:
      type: object
      required: [id, fileId, status, summary, errors, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        status:
          type: string
          enum: [validating, invalid, ready, applying, applied, duplicate, failed]
          description: >-
            validating: đang kiểm; invalid: có lỗi (errors); ready: xem trước được (summary), chờ áp dụng; duplicate:
            tệp cùng nội dung đã được áp (duplicateOf); applying: đang áp; applied: đã áp; failed: không đọc được
            tệp hay áp thất bại (errors: dòng có dữ liệu vừa đổi từ lúc kiểm)
        summary:
          $ref: "#/components/schemas/CatalogImportSummary"
        errors:
          type: array
          description: Lỗi theo dòng, xếp theo dòng rồi cột (tối đa 1.000; tổng số ở summary.errors)
          items:
            $ref: "#/components/schemas/CatalogImportError"
        duplicateOf:
          type: string
          format: uuid
          description: Bản nhập đã áp cùng tệp (chỉ khi duplicate)
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CatalogImportSummary:
      type: object
      required: [models, create, update, unchanged]
      properties:
        models:
          type: integer
          format: int32
          description: Số mẫu trong tệp (ready)
        create:
          type: integer
          format: int32
          description: Số biến thể sẽ tạo
        update:
          type: integer
          format: int32
          description: Số biến thể có sẵn sẽ sửa
        unchanged:
          type: integer
          format: int32
          description: Số biến thể có sẵn giữ nguyên
        errors:
          type: integer
          format: int32
          description: Tổng số lỗi (invalid)
    CatalogImportError:
      type: object
      required: [row, column, code, message]
      properties:
        row:
          type: integer
          format: int32
          description: Dòng Excel (0 là lỗi của cả tệp)
        column:
          type: string
          description: Tiêu đề cột (rỗng là lỗi của cả dòng hay cả tệp)
        code:
          type: string
          description: Mã lỗi (missing_required, invalid_price, …, file_not_xlsx, header_mismatch)
        message:
          type: string
          description: Câu tiếng Việt cho nhân viên; không chép nội dung ô dài quá 50 ký tự
    RegenerateImagesRequest:
      type: object
      additionalProperties: false
      required: [presetVersion]
      properties:
        presetVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Bản bộ kích thước (như IMAGE_PRESET_VERSION); chưa có trong bảng của máy chủ → 422 unknown_preset
    RegenerateImagesResult:
      type: object
      required: [enqueued]
      properties:
        enqueued:
          type: integer
          format: int32
          description: Số lệnh file.regenerate mới xếp (tệp đã có lệnh cho bản này không tính)
    CreateUploadRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 64
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Tên gốc, chỉ để hiện và đặt tên khi tải về; không bao giờ vào khóa trên kho
        contentType:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    Upload:
      type: object
      required: [fileId, putUrl, headers, expiresAt]
      properties:
        fileId:
          type: string
          format: uuid
        putUrl:
          type: string
        headers:
          type: object
          description: Header phải gửi kèm PUT (đã nằm trong chữ ký)
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
