      summary: 'Chốt comment live: đơn nháp có giữ hàng (hay thêm vào nháp đang có), xin địa chỉ; một comment một đơn (Task 172)'
      description: |
        Cần thêm order.create (mode new) hay order.update (mode add_to_draft) toàn shop. Comment đã chốt → 409
        comment_claimed (claimedBy, orderId, orderCode); khách đã có nháp của phiên → 409 open_draft_exists (drafts);
        hết hàng → 409 out_of_stock (variantIds, available), không tạo gì; người bán khác Page → 422 seller_mismatch.
      x-permission: live.operate
      parameters:
        - $ref: "#/components/parameters/LiveCommentID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimLiveCommentRequest"
      responses:
        "201":
          description: claimLiveComment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimLiveCommentResult"
        default:
          $ref: "#/components/responses/Error"
  # M6 — báo cáo vận hành (kế hoạch M6, Task 225 = M6-02; hợp đồng viết một lần cho cả mốc, operation trả 501 tới
  # task của nó: tests/arch/testdata/m6_pending.txt). Ngày `from`, `to` là ngày giờ Việt Nam (UTC+7), tính trọn ngày,
  # tối đa 366 ngày (quá → 400 range_too_long; sai dạng, from > to → 400 bad_date). Mọi GET báo cáo chạy tại chỗ có
  # chỗ và hạn giờ: hết chỗ hay quá hạn trả 200 `{"status":"run_in_background","reason":"busy"|"timeout"}`, màn hình
  # tạo lần chạy nền. Người bán: máy chủ luôn lọc người bán `own` (Q16), không có tham số. Phạm vi: báo cáo bán hàng
  # lọc theo Page của report.sales.read (đơn không gắn Page chỉ người gán toàn shop thấy), báo cáo tồn theo kho của
  # report.inventory.read. Kết quả không có SĐT, địa chỉ, tên khách (trừ tệp danh sách khách).
  /api/v1/reports/sales/dashboard:
