        webMarkCouponGiven; mã đã trao rời danh sách (QĐ40). Task 491: phân trang theo con trỏ (còn trang sau thì có
        nextCursor, gửi lại nguyên ở cursor; con trỏ sai → 400 invalid_input). Quà website báo gửi lỗi
        (webBirthdayGiftFailed) rời danh sách tới retryAt; lỗi lần thứ 3 thì không vào danh sách nữa (nhân viên nhắn
