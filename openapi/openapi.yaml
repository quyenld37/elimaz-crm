      summary: 'Đổi trạng thái yêu cầu theo sơ đồ khi version khớp (409 version_conflict) (Task 195)'
      description: |
        Sơ đồ: received → in_review | needs_info | confirmed | resolved | rejected; in_review → needs_info | confirmed |
        resolved | rejected; needs_info → in_review | rejected; confirmed (chỉ exchange) → items_received | rejected;
        items_received → resolved | rejected; cạnh khác → 422 invalid_transition. needs_info cần message (5–1000 ký tự,
        hiện cho khách); confirmed cần shipBack (địa chỉ 10–300, mã gói 3–40, ngày hạn không trước hôm nay giờ Việt Nam,
        lưu 23:59:59 giờ Việt Nam); rejected cần outcome.reason 1–500 (thiếu → 422 invalid_input); resolved có
        outcome.trackingCode ≤ 60 tùy chọn.
