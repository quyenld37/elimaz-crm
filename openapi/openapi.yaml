        Tối đa 500 bộ (422 too_many_looks), tối đa 6 bộ trên trang chủ (422 too_many_home_looks, kiểm sau khi khóa danh
        sách); mỗi bộ 1–3 món khác nhau (look_items_invalid), chấm x, y trong 0–100 % (look_dot_invalid, làm tròn 2 chữ
        số), ảnh là một ảnh sản phẩm của các món (look_photo_invalid; bộ đã lưu không đổi ảnh và món thì không kiểm lại),
        giờ kết thúc sau giờ bắt đầu (look_window_invalid); tên 1–28, tiêu đề 60, dòng dẫn 90, câu chuyện 220, màu 60, cỡ
        6 ký tự, chiều cao 130–200, ≤ 6 danh mục, mã và link key khác nhau (invalid_look). Món không cần đang bán (bộ ẩn).
