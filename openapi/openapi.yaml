  /api/v1/web-carrier-settings:
    get:
      operationId: getWebCarrierSettings
      summary: 'Hãng giao hàng trên website: tài khoản ưu tiên, phí dự phòng, các hãng đang bật showOnWeb kèm số vận đơn 30 ngày (Task 198)'
      description: |
        Hãng nào hiện trên website và theo thứ tự nào là showOnWeb, webSort của tài khoản hãng (updateCarrierAccount).
        Chưa lưu lần nào → không ưu tiên, không phí dự phòng, version 1. carriers gồm mọi tài khoản bật showOnWeb trừ
        revoked (tài khoản không active không hiện trên website); shipments30d đếm vận đơn chưa hủy tạo trong 30 ngày.
      x-permission: fulfillment.carrier_accounts.read
      responses:
        "200":
          description: getWebCarrierSettings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCarrierSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: saveWebCarrierSettings
      summary: 'Lưu tài khoản ưu tiên và phí dự phòng của website khi version khớp (409 version_conflict) (Task 198)'
      description: |
        Gửi cả bộ: thiếu preferredAccountId = không ưu tiên (rẻ nhất đứng đầu); thiếu fallbackFee = không phí dự phòng.
        Tài khoản ưu tiên phải active và đang hiện trên website, không thì 422 carrier_not_on_web. Phí dự phòng
        (0–500.000 đồng; ngoài khoảng → 422 setting_out_of_range) là phí website hiện khi không hãng nào báo phí được
        (tài khoản nhập tay, hãng lỗi hay quá 3 s); không có thì website nhận 503 retry_later.
      x-permission: fulfillment.carrier_accounts.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWebCarrierSettingsRequest"
      responses:
        "200":
          description: saveWebCarrierSettings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCarrierSettings"
        default:
          $ref: "#/components/responses/Error"
