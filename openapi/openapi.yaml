              $ref: "#/components/schemas/WebBirthdayStopRequest"
      responses:
        "200":
          description: Lúc dừng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebBirthdayStopResult"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/feedback:
    post:
      operationId: webSubmitFeedback
      summary: Website gửi góp ý của khách (form /gop-y) (Task 455)
      description: |
        Idempotency-Key do website sinh khi khách mở form: gửi lại cùng khóa trả cùng mã, một dòng. contact là SĐT của
        khách có sẵn → gắn hồ sơ giữ SĐT đó (đọc trả gốc hiện tại); không khớp → không gắn, không tạo khách. Trường sai → 400 invalid_input.
      x-auth: service_key
      x-permission: web.feedback.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFeedbackRequest"
      responses:
        "201":
          description: Đã lưu góp ý
