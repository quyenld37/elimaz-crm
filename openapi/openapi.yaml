# Hợp đồng API của CRM (kế hoạch M0 bản 5, Task 6). Đây là nguồn: mã máy chủ (ogen, internal/httpapi/gen), bảng
# route (tools/routegen -> internal/httpapi/routes_gen.go) và client của màn hình đều sinh từ tệp này (`make gen`).
# Luật: .claude/rules/openapi.md. Mỗi operation có đúng một trong `x-permission` hoặc `x-public: true`; mọi operation
# ghi có tham số IdempotencyKey. Thay đổi phá vỡ cần dòng trong openapi/breaking-approved.yaml (`make oasdiff`).
openapi: 3.0.3
info:
  title: CRM ELIMAZ
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Tiến trình còn sống
      x-public: true
      responses:
        "200":
          description: Còn sống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      summary: Sẵn sàng nhận yêu cầu (database trả lời trong 1 s)
      x-public: true
      responses:
        "200":
          description: Sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database không trả lời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/deep:
    get:
      operationId: healthDeep
      summary: Kiểm sâu cho dịch vụ canh ngoài (Bearer HEALTH_TOKEN, Task 20); không có dữ liệu khách
      x-public: true
      responses:
        "200":
          description: Mọi chỉ số trong ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        "503":
          description: Có chỉ số quá ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users:
    get:
      operationId: listStaff
      summary: Mọi nhân viên của shop kèm vai trò theo phạm vi
      x-permission: identity.users.manage
      responses:
        "200":
          description: Nhân viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaff
      summary: Tạo nhân viên mới (chưa có vai trò nào)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: Nhân viên vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/grants:
    put:
      operationId: replaceStaffGrants
      summary: Thay toàn bộ vai trò theo phạm vi của một nhân viên (không tự sửa mình, không vượt quyền của mình)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGrantsRequest"
      responses:
        "200":
          description: Nhân viên sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/lock:
    post:
      operationId: lockStaff
      summary: Khóa nhân viên (không khóa Chủ còn hoạt động cuối cùng)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/unlock:
    post:
      operationId: unlockStaff
      summary: Mở khóa nhân viên
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi mở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles:
    get:
      operationId: listRoles
      summary: Vai trò của shop và quyền của từng vai trò
      x-permission: identity.users.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRole
      summary: Tạo vai trò tự định nghĩa từ danh sách quyền có sẵn (người tạo phải có mọi quyền đó ở toàn shop)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Vai trò vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/manage:
    get:
      operationId: listRolesToManage
      summary: Vai trò của shop cho màn Vai trò (cùng dữ liệu listRoles, chỉ cần quyền quản lý vai trò)
      x-permission: identity.roles.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/{id}:
    put:
      operationId: updateRole
      summary: Sửa tên và quyền của vai trò (không sửa được vai trò Chủ; quyền thêm hay gỡ phải có ở toàn shop)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Vai trò sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/{id}/archive:
    post:
      operationId: archiveRole
      summary: Lưu trữ vai trò không còn nhân viên đang hoạt động nào giữ (không lưu trữ được vai trò Chủ)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRoleRequest"
      responses:
        "200":
          description: Vai trò sau khi lưu trữ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/permissions:
    get:
      operationId: listPermissions
      summary: Mọi quyền của CRM kèm nhóm, nhãn tiếng Việt và loại phạm vi (để soạn vai trò)
      x-permission: identity.roles.manage
      responses:
        "200":
          description: Quyền, theo thứ tự của bảng quyền
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Người dùng đang đăng nhập và quyền của họ
      description: Chỉ cần đăng nhập và tài khoản không bị khóa (Task 315); nhân viên chưa có grant nhận grants rỗng.
      x-authenticated: true
      responses:
        "200":
          description: Người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/stream:
    get:
      operationId: stream
      summary: Báo hiệu thay đổi qua SSE (handler SSE riêng, Task 16)
      x-permission: realtime.subscribe
      responses:
        "200":
          description: Luồng sự kiện
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/uploads:
    post:
      operationId: createUpload
      summary: Xin đường dẫn ký sẵn để trình duyệt tải thẳng một tệp lên kho (chỉ mục đích nhận tải lên)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Tệp chờ tải lên và đường dẫn PUT ký sẵn (hạn 15 phút)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/complete:
    post:
      operationId: completeUpload
      summary: Báo đã tải xong; máy chủ kiểm kho rồi chuyển tệp sang uploaded (ảnh thì xếp việc xử lý)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tệp sau khi kiểm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Trạng thái tệp và các biến thể ảnh công khai
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Tệp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/regenerate:
    post:
      operationId: regenerateImages
      summary: Tạo lại kích thước ảnh từ ảnh gốc theo một bộ kích thước (một lệnh mỗi tệp ảnh ready chưa có bản đó; ảnh riêng tư không áp dụng)
      x-permission: platform.files.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateImagesRequest"
      responses:
        "200":
          description: Số lệnh mới xếp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateImagesResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs:
    get:
      operationId: listJobs
      summary: Việc nền cần người xử lý của tenant người gọi (không có payload)
      x-permission: platform.jobs.manage
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [dead, in_doubt, expired]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Danh sách việc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Đưa việc dead, in_doubt hoặc expired về pending
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/abandon:
    post:
      operationId: abandonJob
      summary: Bỏ việc (chuyển sang expired)
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Tình trạng tiến trình, hàng đợi, sao lưu, lỗi và cảnh báo 24 giờ
      x-permission: platform.health.read
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: Danh sách mẫu (chưa xóa) của người bán, sửa gần nhất trước; lọc trạng thái, danh mục (gồm con), nhãn, tìm theo mã mẫu, SKU, barcode, tên không dấu; trang theo con trỏ
      description: >-
        warehouseId (không bắt buộc) thêm cột available (tổng có thể bán của các biến thể ở kho đó, có thể âm); cần
        thêm quyền inventory.read ở kho đó, không có → 403. Mẫu khớp q tối đa 1.000.
      x-permission: catalog.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              $ref: "#/components/schemas/ProductStatus"
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Một trang mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      summary: Tạo mẫu sản phẩm kèm biến thể màu/size (barcode để trống thì CRM tự sinh EAN-13)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Mẫu vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}:
    get:
      operationId: getProduct
      summary: Một mẫu kèm biến thể, bài viết dạng khối và HTML bài viết dựng sẵn (cả mẫu nháp, ngừng bán)
      x-permission: catalog.read
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: Mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Sửa tên, mô tả, bài viết, trạng thái của mẫu khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Mẫu sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/variants:
    post:
      operationId: addVariant
      summary: Thêm biến thể vào mẫu khi version của mẫu còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVariantRequest"
      responses:
        "201":
          description: Biến thể vừa thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images:
    post:
      operationId: attachProductImage
      summary: Gắn tệp ảnh đã xử lý xong (mục đích product_image) vào cuối danh sách ảnh của mẫu khi version còn khớp
      description: >-
        color (không bắt buộc) là một màu đang có của biến thể trong mẫu. Tệp chưa ready hay không phải ảnh sản phẩm →
        409 file_not_ready; tệp đang gắn → 409 already_exists; tệp đã gắn rồi xóa → hồi lại ảnh cũ ở cuối. Tối đa 50 ảnh.
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachProductImageRequest"
      responses:
        "201":
          description: Mẫu sau khi gắn (kèm ảnh, version mới)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/order:
    put:
      operationId: reorderProductImages
      summary: Đặt thứ tự ảnh đang hiện của mẫu (đúng đủ mã ảnh đang hiện) khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderProductImagesRequest"
      responses:
        "200":
          description: Mẫu sau khi sắp lại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}:
    delete:
      operationId: deleteProductImage
      summary: Xóa mềm một ảnh của mẫu (khôi phục được trong 30 ngày); ảnh đã xóa thì không đổi gì
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Mẫu sau khi xóa ảnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}/color:
    put:
      operationId: setProductImageColor
      summary: Đặt màu của một ảnh đang hiện của mẫu khi version còn khớp (thiếu color → ảnh chung mọi màu)
      description: >-
        color phải là một màu đang có của biến thể trong mẫu (400 invalid_input nếu không). Ảnh đã xóa, của mẫu khác hay
        tenant khác → 404. Version mẫu tăng 1 như các thao tác ảnh khác.
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProductImageColorRequest"
      responses:
        "200":
          description: Mẫu sau khi đổi màu ảnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}/restore:
    post:
      operationId: restoreProductImage
      summary: Khôi phục ảnh đã xóa về vị trí cũ; quá 30 ngày → 410 restore_expired; ảnh đang hiện thì không đổi gì
      x-permission: catalog.manage
      parameters:
