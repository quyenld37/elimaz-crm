      operationId: createCatalogImport
      summary: Tạo bản nhập sản phẩm từ tệp Excel đã tải lên (mục đích catalog_import); kiểm chạy nền
      description: >-
        Tạo bản nhập ở trạng thái validating và xếp lệnh kiểm tệp (catalog.import.validate); đọc kết quả bằng
        getCatalogImport. Tệp không có, của shop khác, đã xóa → 404 not_found; sai mục đích hay chưa tải lên xong → 409
        file_not_ready. Bước áp dụng ở applyCatalogImport.
      x-permission: catalog.import
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
