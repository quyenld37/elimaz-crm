    put:
      operationId: reorderWebCarriers
      summary: 'Đổi thứ tự hãng trên website cả danh sách trong một lần ghi khi version khớp (409 version_conflict) (Task 488)'
      description: |
        accountIds là mọi tài khoản đang hiện trên web (showOnWeb, trừ revoked) theo thứ tự mới; webSort thành 1, 2, 3…
        Tập khác tập đang hiện (có người vừa bật/ẩn) hay version lệch → 409 version_conflict, không đổi gì; mã trùng →
        400 bad_request (uniqueItems). version của cài đặt tăng 1 (người, giờ lưu cuối là người đổi thứ tự); audit
        fulfillment.web_carrier_order.update; sự kiện carrier.web_settings_changed làm mới bộ đệm website.
      x-permission: fulfillment.carrier_accounts.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderWebCarriersRequest"
      responses:
        "200":
          description: reorderWebCarriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCarrierSettings"
        default:
          $ref: "#/components/responses/Error"
