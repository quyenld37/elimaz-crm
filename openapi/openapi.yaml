    get:
      operationId: webHomeLooks
      summary: Bộ phối cho website — home=true các bộ hiện trên trang chủ (≤ 6, theo vị trí) và các bộ trang chủ đang bị ẩn; home=false mọi bộ mở được bằng link; có ETag
      description: |
        Task 454 (M5-42). Bộ đã dựng sẵn phần không phụ thuộc giá (tiêu đề, dòng người mẫu, ảnh, danh mục cho "Bán chạy
        cho dịp này", link); giá, cỡ, màu còn hàng website tự lấy từ API danh mục. hidden (chỉ khi home=true): bộ đang bật
