      summary: 'Danh sách đơn của một ô số (cùng tập với tổng), keyset theo mốc giảm dần (BC02, Task M6-07)'
      description: |
        Cùng bộ lọc với getSalesOrdersReport. cellDimension + cellKey chọn một dòng của báo cáo (bỏ trống: cả bảng);
        metric chọn cột. Chỉ mã đơn, mã khách, trạng thái, tiền, kênh, nguồn, nhân viên, hãng; không SĐT, địa chỉ, tên
        khách. total đếm cả tập (trang sau giữ total của trang đầu qua con trỏ).
      x-permission: report.sales.read
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
