      description: >-
        Cần inventory.read ở đúng kho warehouseId, không có → 403. Chỉ biến thể đã có dòng số dư ở kho đó. available =
        onHand − damaged − held − inTransit, có thể âm sau kiểm kho đếm thiếu (Q8); onlyShort=true chỉ trả dòng
        available < 0. Biến thể khớp q tối đa 100.
      x-permission: inventory.read
      parameters:
        - name: warehouseId
