    # M5-05 (ADR-18): khóa dịch vụ của website, header Authorization: Bearer ek_<tiền tố>_<bí mật>; chỉ path
    # /api/v1/web/* (x-auth: service_key). Route của nhân viên xác thực bằng header cf-access-jwt-assertion, không
    # khai ở đây; lớp HTTP (internal/httpapi/auth.go) kiểm cả hai, không qua bộ kiểm bảo mật của ogen.
    ServiceKey:
