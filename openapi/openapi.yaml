      description: |
        Hãng nào hiện trên website và theo thứ tự nào là showOnWeb, webSort của tài khoản hãng (updateCarrierAccount).
        Chưa lưu lần nào → không ưu tiên, không phí dự phòng, version 1. carriers gồm mọi tài khoản bật showOnWeb trừ
        revoked (tài khoản không active không hiện trên website); shipments30d đếm vận đơn chưa hủy tạo trong 30 ngày.
      x-permission: fulfillment.carrier_accounts.read
