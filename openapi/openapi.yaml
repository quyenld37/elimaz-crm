        - $ref: "#/components/parameters/ReportChannel"
        - $ref: "#/components/parameters/ReportSourceID"
        - $ref: "#/components/parameters/ReportCareBy"
        - $ref: "#/components/parameters/ReportCreatedBy"
        - $ref: "#/components/parameters/ReportPageID"
        - $ref: "#/components/parameters/ReportCarrierKey"
        - name: cellDimension
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReportDimension"
        - name: cellKey
          in: query
          required: false
          description: Khóa dòng (key của SalesOrdersRow); cần cellDimension
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: metric
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ReportMetric"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
