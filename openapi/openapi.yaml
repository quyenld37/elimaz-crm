          description: Mã hãng nhập tay (chỉ tài khoản mode manual); trùng vận đơn khác → 409 tracking_code_conflict
        feeActual:
          $ref: "#/components/schemas/Money"
    Shipment:
      type: object
      required: [id, orderId, code, carrierKey, carrierAccountId, status, codAmount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        code:
          type: string
          description: Mã vận đơn của CRM (E + yyMMdd + 6 ký tự)
        carrierKey:
          type: string
        carrierAccountId:
          type: string
          format: uuid
        trackingCode:
          type: string
          description: Mã của hãng; chưa có khi vận đơn còn creating
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        codAmount:
          $ref: "#/components/schemas/Money"
        fee:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
        # Trường của ShipmentView (M3, Task M3-12); tùy chọn để thân của M1 vẫn đúng. Không bao giờ có ship_to.
        accountName:
          type: string
        mode:
          $ref: "#/components/schemas/CarrierAccountMode"
        service:
          type: string
        label:
          type: string
          description: Nhãn hiển thị của trạng thái (orderview)
        subStatus:
          type: string
          description: Trạng thái phụ của hãng (mã, không dữ liệu cá nhân)
        createState:
          type: string
          enum: [pending, not_sent, unknown, created, rejected, manual]
          description: Kết quả lệnh tạo ở hãng (Q-5); unknown là "không rõ hãng đã tạo chưa"
        cancelKind:
          type: string
          description: 'Lý do hủy: order_cancel, replace, create_rejected, carrier_cancelled, manual, staff_after_unknown'
        codCollectedAmount:
          $ref: "#/components/schemas/Money"
        feeActual:
          $ref: "#/components/schemas/Money"
        weightGrams:
          type: integer
          format: int32
        options:
          $ref: "#/components/schemas/CarrierOptions"
        pickedUpAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        lastStatusAt:
          type: string
          format: date-time
        lastCarrierEventAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
        lastSyncError:
          type: string
          description: Mã lỗi lần tra gần nhất (không thông điệp thô của hãng)
        stuckSince:
          type: string
          format: date-time
        needsReview:
          type: boolean
        labelReady:
          type: boolean
        partial:
          type: boolean
          description: Giao một phần (Task M3-26)
        version:
          type: integer
          format: int64
    ShipmentStatus:
      type: string
      description: >-
        Trạng thái vận đơn (M1 năm giá trị; M3 Task M3-07 thêm delivery_failed, returning, returned,
        cancel_requested). creating là "đang gửi hãng".
      enum: [creating, awaiting_pickup, shipping, delivery_failed, delivered, returning, returned, cancel_requested, cancelled]
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Tiền, số nguyên đồng
    CatalogCode:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
      description: Mã mẫu hay SKU; CRM chuẩn hóa viết hoa
    Barcode:
      type: string
      pattern: "^[0-9A-Za-z-]{4,32}$"
    OptionText:
      type: string
      minLength: 1
      maxLength: 50
      description: Màu hay size
    ColorHex:
      type: string
      pattern: "^(#[0-9A-Fa-f]{6})?$"
      description: Mã màu cho ô màu (#RRGGBB); rỗng là không có
    ProductStatus:
      type: string
      enum: [draft, active, discontinued]
    VariantStatus:
      type: string
      enum: [active, discontinued]
    ArticleInput:
      type: array
      maxItems: 200
      description: Bài viết dạng khối (lược đồ ArticleBlock). Máy chủ kiểm lược đồ và giới hạn; sai → 422 invalid_article.
      items: {}
    ArticleBlock:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [paragraph, heading, list, image]
        text:
          type: string
        level:
          type: integer
          enum: [2, 3]
        items:
          type: array
          items:
            type: string
        fileId:
          type: string
          format: uuid
        caption:
          type: string
    VariantInput:
      type: object
      required: [sku, color, size, price]
      properties:
        sku:
          $ref: "#/components/schemas/CatalogCode"
        barcode:
          $ref: "#/components/schemas/Barcode"
        color:
          $ref: "#/components/schemas/OptionText"
        colorHex:
          $ref: "#/components/schemas/ColorHex"
        size:
          $ref: "#/components/schemas/OptionText"
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          $ref: "#/components/schemas/Money"
    CreateProductRequest:
      type: object
      required: [code, name, variants]
      properties:
        code:
          $ref: "#/components/schemas/CatalogCode"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        article:
          $ref: "#/components/schemas/ArticleInput"
        status:
          $ref: "#/components/schemas/ProductStatus"
        measureCm:
          $ref: "#/components/schemas/MeasureCm"
        variants:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/VariantInput"
    MeasureCm:
      type: object
      description: >-
        Số đo của mẫu (Task 516, 517): Dài, Rộng, Cao theo cm, 0,1–1000, tối đa một chữ số thập phân (vd 72.5), mỗi số
        tùy chọn (vắng mặt là chưa nhập). Số ngoài khoảng hay có hơn một chữ số thập phân → 422 invalid_input. Cùng dạng
        với measureCm của website (chỉ các số đã nhập)
      properties:
        length:
          type: number
          format: double
          description: Dài (cm)
        width:
          type: number
          format: double
          description: Rộng (cm)
        height:
          type: number
          format: double
          description: Cao (cm)
    UpdateProductRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        article:
          $ref: "#/components/schemas/ArticleInput"
        status:
          $ref: "#/components/schemas/ProductStatus"
        measureCm:
          type: object
          nullable: true
          description: >-
            Số đo mới của mẫu (cm, mỗi số 0,1–1000, tối đa một chữ số thập phân; sai → 422 invalid_input): vắng mặt
            giữ nguyên; null bỏ cả ba số; một đối tượng đặt đúng các số trong đó (số vắng mặt là bỏ số đó) (Task 516, 517)
          properties:
            length:
              type: number
              format: double
              description: Dài (cm)
            width:
              type: number
              format: double
              description: Rộng (cm)
            height:
              type: number
              format: double
              description: Cao (cm)
    AddVariantRequest:
      type: object
      required: [productVersion, sku, color, size, price]
      properties:
        productVersion:
          type: integer
          format: int64
        sku:
          $ref: "#/components/schemas/CatalogCode"
        barcode:
          $ref: "#/components/schemas/Barcode"
        color:
          $ref: "#/components/schemas/OptionText"
        colorHex:
          $ref: "#/components/schemas/ColorHex"
        size:
          $ref: "#/components/schemas/OptionText"
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          $ref: "#/components/schemas/Money"
    UpdateVariantRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        sku:
          $ref: "#/components/schemas/CatalogCode"
        barcode:
          $ref: "#/components/schemas/Barcode"
        color:
          $ref: "#/components/schemas/OptionText"
        colorHex:
          $ref: "#/components/schemas/ColorHex"
        size:
          $ref: "#/components/schemas/OptionText"
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
          description: Giá nhập; null bỏ giá nhập
        status:
          $ref: "#/components/schemas/VariantStatus"
        weightGrams:
          type: integer
          format: int32
          nullable: true
          description: Cân nặng (gam, 1–50.000, ngoài khoảng → 422 invalid_input); null bỏ cân nặng (Task 190, QĐ30)
    Variant:
      type: object
      required: [id, productId, sku, barcode, color, size, price, status, version]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        color:
          type: string
        colorHex:
          type: string
        size:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/VariantStatus"
        version:
          type: integer
          format: int64
        weightGrams:
          type: integer
          format: int32
          description: Cân nặng (gam); vắng mặt là chưa nhập (Task 190, QĐ30)
    WebProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebProduct"
        nextCursor:
          type: string
          description: Gửi lại ở cursor để lấy trang kế; vắng mặt là hết (và khi đọc theo ids)
    WebProduct:
      type: object
      required: [id, sellerId, code, name, shortDescription, articleHtml, status, categoryIds, tags, attributes, images, variants, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        articleHtml:
          type: string
          description: HTML bài viết dựng bằng catalog.ArticleHTML (đã thoát, ảnh theo bộ kích thước hiện hành); rỗng khi lỗi
        status:
          $ref: "#/components/schemas/ProductStatus"
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          description: Mã nhãn (tên ở webCatalogTaxonomy)
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/WebAttr"
        images:
          type: array
          description: Ảnh đã xử lý xong theo thứ tự hiện (ảnh đang xử lý chưa có)
          items:
            $ref: "#/components/schemas/WebImage"
        variants:
          type: array
          description: >-
            Theo thứ tự nhân viên đặt trong CRM, rồi mã (Task 513); website giữ nguyên thứ tự mảng và suy thứ tự màu, cỡ
            theo lần xuất hiện đầu tiên
          items:
            $ref: "#/components/schemas/WebVariant"
        updatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: >-
            Ngày tạo mẫu (Task 489; sắp xếp "Mới nhất"). CRM luôn gửi; chỉ có thể vắng trong ≤ 60 s sau khi nâng cấp
            (bản đệm cũ)
        version:
          type: integer
          format: int64
        measureCm:
          $ref: "#/components/schemas/MeasureCm"
    WebAttr:
      type: object
      required: [name, value, position]
      properties:
        name:
          type: string
        value:
          type: string
        position:
          type: integer
          format: int32
    WebImage:
      type: object
      required: [position, variants]
      properties:
        position:
          type: integer
          format: int32
        color:
          type: string
          description: Màu của biến thể mà ảnh thuộc về; vắng mặt là ảnh chung
        variants:
          type: array
          items:
            $ref: "#/components/schemas/WebImageVariant"
    WebImageVariant:
      type: object
      required: [width, format, url]
      properties:
        width:
          type: integer
          format: int32
        format:
          type: string
        url:
          type: string
    WebVariant:
      type: object
      required: [id, sku, barcode, color, size, price, status, sellable, available]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        color:
          type: string
        size:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/VariantStatus"
        sellable:
          type: boolean
          description: Mẫu và biến thể đang bán (false → website ẩn, không đặt được)
        available:
          type: boolean
          description: Còn hàng có thể bán ở kho mặc định (số chính xác ở lúc đặt hàng)
        weightGrams:
          type: integer
          format: int32
    WebCatalogChanges:
      type: object
      required: [productIds, until, hasMore, serverTime]
      properties:
        productIds:
          type: array
          items:
            type: string
            format: uuid
        until:
          type: string
          format: date-time
        hasMore:
          type: boolean
        serverTime:
          type: string
          format: date-time
          description: >-
            Giờ của máy chủ CRM lúc đọc (now() của PostgreSQL, cùng đồng hồ với until), có ở mọi câu trả lời (Task 489).
            Website dùng để biết độ cũ của bản sao và làm mốc cho bản sao đầu (since = serverTime − 30 s, lấy trước khi
            tải cả danh mục), không dùng đồng hồ của máy website
