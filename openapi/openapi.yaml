# Hợp đồng API của CRM (kế hoạch M0 bản 5, Task 6). Đây là nguồn: mã máy chủ (ogen, internal/httpapi/gen), bảng
# route (tools/routegen -> internal/httpapi/routes_gen.go) và client của màn hình đều sinh từ tệp này (`make gen`).
# Luật: .claude/rules/openapi.md. Mỗi operation có đúng một trong `x-permission` hoặc `x-public: true`; mọi operation
# ghi có tham số IdempotencyKey. Thay đổi phá vỡ cần dòng trong openapi/breaking-approved.yaml (`make oasdiff`).
openapi: 3.0.3
info:
  title: CRM ELIMAZ
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Tiến trình còn sống
      x-public: true
      responses:
        "200":
          description: Còn sống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      summary: Sẵn sàng nhận yêu cầu (database trả lời trong 1 s)
      x-public: true
      responses:
        "200":
          description: Sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database không trả lời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/deep:
    get:
      operationId: healthDeep
      summary: Kiểm sâu cho dịch vụ canh ngoài (Bearer HEALTH_TOKEN, Task 20); không có dữ liệu khách
      x-public: true
      responses:
        "200":
          description: Mọi chỉ số trong ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        "503":
          description: Có chỉ số quá ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users:
    get:
      operationId: listStaff
      summary: Mọi nhân viên của shop kèm vai trò theo phạm vi
      x-permission: identity.users.manage
      responses:
        "200":
          description: Nhân viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaff
      summary: Tạo nhân viên mới (chưa có vai trò nào)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: Nhân viên vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/grants:
    put:
      operationId: replaceStaffGrants
      summary: Thay toàn bộ vai trò theo phạm vi của một nhân viên (không tự sửa mình, không vượt quyền của mình)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGrantsRequest"
      responses:
        "200":
          description: Nhân viên sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/lock:
    post:
      operationId: lockStaff
      summary: Khóa nhân viên (không khóa Chủ còn hoạt động cuối cùng)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/unlock:
    post:
      operationId: unlockStaff
      summary: Mở khóa nhân viên
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi mở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles:
    get:
      operationId: listRoles
      summary: Vai trò của shop và quyền của từng vai trò
      x-permission: identity.users.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Người dùng đang đăng nhập và quyền của họ
      description: Chỉ cần đăng nhập và tài khoản không bị khóa (Task 315); nhân viên chưa có grant nhận grants rỗng.
      x-authenticated: true
      responses:
        "200":
          description: Người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/stream:
    get:
      operationId: stream
      summary: Báo hiệu thay đổi qua SSE (handler SSE riêng, Task 16)
      x-permission: realtime.subscribe
      responses:
        "200":
          description: Luồng sự kiện
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/uploads:
    post:
      operationId: createUpload
      summary: Xin đường dẫn ký sẵn để trình duyệt tải thẳng một tệp lên kho (chỉ mục đích nhận tải lên)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Tệp chờ tải lên và đường dẫn PUT ký sẵn (hạn 15 phút)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/complete:
    post:
      operationId: completeUpload
      summary: Báo đã tải xong; máy chủ kiểm kho rồi chuyển tệp sang uploaded (ảnh thì xếp việc xử lý)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tệp sau khi kiểm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Trạng thái tệp và các biến thể ảnh công khai
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Tệp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs:
    get:
      operationId: listJobs
      summary: Việc nền cần người xử lý của tenant người gọi (không có payload)
      x-permission: platform.jobs.manage
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [dead, in_doubt, expired]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Danh sách việc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Đưa việc dead, in_doubt hoặc expired về pending
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/abandon:
    post:
      operationId: abandonJob
      summary: Bỏ việc (chuyển sang expired)
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Tình trạng tiến trình, hàng đợi, sao lưu, lỗi và cảnh báo 24 giờ
      x-permission: platform.health.read
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products:
    post:
      operationId: createProduct
      summary: Tạo mẫu sản phẩm kèm biến thể màu/size (barcode để trống thì CRM tự sinh EAN-13)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Mẫu vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}:
    get:
      operationId: getProduct
      summary: Một mẫu kèm biến thể, bài viết dạng khối và HTML bài viết dựng sẵn (cả mẫu nháp, ngừng bán)
      x-permission: catalog.read
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: Mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Sửa tên, mô tả, bài viết, trạng thái của mẫu khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Mẫu sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/variants:
    post:
      operationId: addVariant
      summary: Thêm biến thể vào mẫu khi version của mẫu còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVariantRequest"
      responses:
        "201":
          description: Biến thể vừa thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/variants/{id}:
    patch:
      operationId: updateVariant
      summary: Sửa SKU, barcode, màu, size, giá, giá nhập, trạng thái của biến thể khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/VariantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariantRequest"
      responses:
        "200":
          description: Biến thể sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng của yêu cầu ghi (ADR-41); gửi lại cùng khóa trả cùng kết quả.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Lỗi; không bao giờ có vết lỗi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, request_id]
      # Mọi mã `error` máy chủ có thể trả (Task 48). Màn hình phải có câu tiếng Việt cho từng mã
      # (console/src/app/errors.ts, test errors.test.ts đọc danh sách này); mọi hằng code* của
      # internal/httpapi/errors.go phải có ở đây (TestErrorCodes_DeclaredInContract). Mã của mốc sau được khai trước
      # theo kế hoạch; thêm mã mới thì thêm dòng ở đây và câu ở errors.ts.
      x-error-codes:
        # Chung (M0)
        - already_processed
        - bad_origin
        - bad_request
        - body_too_large
        - forbidden
        - idempotency_key_invalid
        - idempotency_key_required
        - idempotency_key_reused
        - internal
        - invalid_input
        - job_state_conflict
        - mfa_required
        - not_found
        - not_implemented
        - rate_limited
        - request_in_progress
        - retry_later
        - stream_unavailable
        - unauthenticated
        - unsupported_media_type
        - version_conflict
        # Nhân viên và vai trò (M1-26, M1-56)
        - cannot_modify_self
        - email_taken
        - grant_exceeds_actor
        - last_owner
        - owner_role_locked
        - role_archived
        - role_in_use
        - role_name_taken
        - unknown_permission
        # Sản phẩm, danh mục (M1-27, M1-34)
        - barcode_taken
        - category_cycle
        - category_in_use
        - category_too_deep
        - code_taken
        - duplicate_option
        - invalid_article
        - invalid_price
        - not_for_sale
        - sku_taken
        # Kho (M1-28, M1-29, M1-35)
        - document_not_draft
        - insufficient_stock
        - stocktake_not_open
        - stocktake_open
        - supplier_archived
        - supplier_name_taken
        - supplier_not_for_kind
        # Đơn, vận chuyển (M1-30, M1-31)
        - mixed_sellers
        - out_of_stock
        - shipment_exists
        - total_overflow
        - variant_not_for_sale
        # Tệp, ảnh, nhập Excel (M1-41, M1-44, M1-47)
        - file_not_ready
        - file_purpose_not_allowed
        - file_too_large
        - file_type_not_allowed
        - import_not_ready
        - restore_expired
        - upload_missing
      properties:
        error:
          type: string
          description: Mã lỗi máy đọc được
        request_id:
          type: string
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
    DeepHealth:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        workerHeartbeatAgeS:
          type: integer
          format: int64
        ingestHeartbeatAgeS:
          type: integer
          format: int64
        oldestPendingAgeS:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        inDoubt:
          type: integer
          format: int64
        spoolFiles:
          type: integer
          format: int64
        lastWalArchivedAgeS:
          type: integer
          format: int64
        lastBackupAgeH:
          type: integer
          format: int64
    Scope:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [all, page, warehouse]
        id:
          type: string
    Grant:
      type: object
      required: [permission, scope]
      properties:
        permission:
          type: string
        scope:
          $ref: "#/components/schemas/Scope"
    Me:
      type: object
      required: [userId, email, grants]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        grants:
          type: array
          description: Chỉ grant có hiệu lực; quyền quản trị gán theo kho, theo Page nằm ở warnings (Task 315)
          items:
            $ref: "#/components/schemas/Grant"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScopeWarning"
    ScopeWarning:
      type: object
      description: Gán ở phạm vi hẹp hơn toàn shop có quyền quản trị; các quyền đó không có hiệu lực (Task 315)
      required: [code, message, scopeType, scopeId, permissions]
      properties:
        code:
          type: string
          enum: [admin_needs_shop_scope]
        message:
          type: string
        roleKey:
          type: string
          description: Vai trò của gán (có ở StaffMember; không có ở Me)
        scopeType:
          type: string
          enum: [all, page, warehouse]
        scopeId:
          type: string
        permissions:
          type: array
          items:
            type: string
    StaffGrant:
      type: object
      required: [roleKey, scopeType, scopeId]
      properties:
        roleKey:
          type: string
          minLength: 1
          maxLength: 64
        scopeType:
          type: string
          enum: [all, page, warehouse]
        scopeId:
          type: string
          maxLength: 128
          description: Mã đích (Page, kho); rỗng khi scopeType là all
    StaffMember:
      type: object
      required: [id, email, displayName, status, version, createdAt, grants]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [active, locked]
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: "#/components/schemas/StaffGrant"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScopeWarning"
    CreateStaffRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 200
    ReplaceGrantsRequest:
      type: object
      required: [version, grants]
      properties:
        version:
          type: integer
          format: int64
        grants:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffGrant"
    Role:
      type: object
      required: [key, name, status, customized, permissions]
      properties:
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        customized:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    CreateUploadRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 64
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Tên gốc, chỉ để hiện và đặt tên khi tải về; không bao giờ vào khóa trên kho
        contentType:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    Upload:
      type: object
      required: [fileId, putUrl, headers, expiresAt]
      properties:
        fileId:
          type: string
          format: uuid
        putUrl:
          type: string
        headers:
          type: object
          description: Header phải gửi kèm PUT (đã nằm trong chữ ký)
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    FileVariant:
      type: object
      required: [width, format, url]
      properties:
        width:
          type: integer
          format: int32
        format:
          type: string
          enum: [avif, webp, jpeg]
        url:
          type: string
    FileInfo:
      type: object
      required: [id, purpose, status, variants]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
        status:
          type: string
          enum: [awaiting_upload, uploaded, processing, ready, rejected, lost]
        rejectReason:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        variants:
          type: array
          items:
            $ref: "#/components/schemas/FileVariant"
    Job:
      type: object
      required: [id, kind, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        attempts:
          type: integer
          format: int32
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
    ProcessHealth:
      type: object
      required: [role, lastHeartbeatAgeS]
      properties:
        role:
          type: string
        lastHeartbeatAgeS:
          type: integer
          format: int64
    QueueHealth:
      type: object
      required: [oldestPendingAgeS, pending, dead, inDoubt]
      properties:
        oldestPendingAgeS:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        inDoubt:
          type: integer
          format: int64
    IngestHealth:
      type: object
      required: [spoolFiles]
      properties:
        spoolFiles:
          type: integer
          format: int64
    BackupHealth:
      type: object
      properties:
        lastBaseAgeH:
          type: integer
          format: int64
        lastDrillAgeH:
          type: integer
          format: int64
        lastDrillOk:
          type: boolean
    ErrorSummary:
      type: object
      required: [fingerprint, name, role, count, lastSeenAt]
      properties:
        fingerprint:
          type: string
        name:
          type: string
        role:
          type: string
        count:
          type: integer
          format: int64
        lastSeenAt:
          type: string
          format: date-time
    AlertSummary:
      type: object
      required: [key, severity, sentAt]
      properties:
        key:
          type: string
        severity:
          type: string
          enum: [normal, urgent]
        sentAt:
          type: string
          format: date-time
    PlatformHealth:
      type: object
      required: [processes, queue, ingest, backup, errors, alerts]
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessHealth"
        queue:
          $ref: "#/components/schemas/QueueHealth"
        ingest:
          $ref: "#/components/schemas/IngestHealth"
        backup:
          $ref: "#/components/schemas/BackupHealth"
        errors:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ErrorSummary"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertSummary"
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Tiền, số nguyên đồng
    CatalogCode:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
      description: Mã mẫu hay SKU; CRM chuẩn hóa viết hoa
    Barcode:
      type: string
      pattern: "^[0-9A-Za-z-]{4,32}$"
    OptionText:
      type: string
      minLength: 1
      maxLength: 50
      description: Màu hay size
    ColorHex:
      type: string
      pattern: "^(#[0-9A-Fa-f]{6})?$"
      description: Mã màu cho ô màu (#RRGGBB); rỗng là không có
    ProductStatus:
      type: string
      enum: [draft, active, discontinued]
    VariantStatus:
      type: string
      enum: [active, discontinued]
    ArticleInput:
      type: array
      maxItems: 200
      description: Bài viết dạng khối (lược đồ ArticleBlock). Máy chủ kiểm lược đồ và giới hạn; sai → 422 invalid_article.
      items: {}
    ArticleBlock:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [paragraph, heading, list, image]
        text:
          type: string
        level:
          type: integer
          enum: [2, 3]
        items:
          type: array
          items:
            type: string
        fileId:
          type: string
          format: uuid
        caption:
          type: string
    VariantInput:
      type: object
      required: [sku, color, size, price]
      properties:
        sku:
          $ref: "#/components/schemas/CatalogCode"
        barcode:
          $ref: "#/components/schemas/Barcode"
        color:
          $ref: "#/components/schemas/OptionText"
        colorHex:
          $ref: "#/components/schemas/ColorHex"
        size:
          $ref: "#/components/schemas/OptionText"
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          $ref: "#/components/schemas/Money"
    CreateProductRequest:
      type: object
      required: [code, name, variants]
      properties:
        code:
          $ref: "#/components/schemas/CatalogCode"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        article:
          $ref: "#/components/schemas/ArticleInput"
        status:
          $ref: "#/components/schemas/ProductStatus"
        variants:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/VariantInput"
    UpdateProductRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        article:
          $ref: "#/components/schemas/ArticleInput"
        status:
          $ref: "#/components/schemas/ProductStatus"
    AddVariantRequest:
      type: object
      required: [productVersion, sku, color, size, price]
      properties:
        productVersion:
          type: integer
          format: int64
        sku:
          $ref: "#/components/schemas/CatalogCode"
        barcode:
          $ref: "#/components/schemas/Barcode"
        color:
          $ref: "#/components/schemas/OptionText"
        colorHex:
          $ref: "#/components/schemas/ColorHex"
        size:
          $ref: "#/components/schemas/OptionText"
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          $ref: "#/components/schemas/Money"
    UpdateVariantRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        sku:
          $ref: "#/components/schemas/CatalogCode"
        barcode:
          $ref: "#/components/schemas/Barcode"
        color:
          $ref: "#/components/schemas/OptionText"
        colorHex:
          $ref: "#/components/schemas/ColorHex"
        size:
          $ref: "#/components/schemas/OptionText"
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
          description: Giá nhập; null bỏ giá nhập
        status:
          $ref: "#/components/schemas/VariantStatus"
    Variant:
      type: object
      required: [id, productId, sku, barcode, color, size, price, status, version]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        color:
          type: string
        colorHex:
          type: string
        size:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        costPrice:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/VariantStatus"
        version:
          type: integer
          format: int64
    Product:
      type: object
      required: [id, code, name, description, article, articleHtml, status, version, variants]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        article:
          type: array
          items:
            $ref: "#/components/schemas/ArticleBlock"
        articleHtml:
          type: string
          readOnly: true
          description: HTML bài viết dựng bằng catalog.RenderArticleHTML (chỉ thẻ trong danh sách cho phép, R7)
        status:
          $ref: "#/components/schemas/ProductStatus"
        version:
          type: integer
          format: int64
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
