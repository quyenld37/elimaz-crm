        campaignDiscount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        couponDiscount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        shippingFee:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        grandTotal:
