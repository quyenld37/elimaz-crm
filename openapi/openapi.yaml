# Hợp đồng API của CRM (kế hoạch M0 bản 5, Task 6). Đây là nguồn: mã máy chủ (ogen, internal/httpapi/gen), bảng
# route (tools/routegen -> internal/httpapi/routes_gen.go) và client của màn hình đều sinh từ tệp này (`make gen`).
# Luật: .claude/rules/openapi.md. Mỗi operation có đúng một trong `x-permission` hoặc `x-public: true`; mọi operation
# ghi có tham số IdempotencyKey. Thay đổi phá vỡ cần dòng trong openapi/breaking-approved.yaml (`make oasdiff`).
openapi: 3.0.3
info:
  title: CRM ELIMAZ
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Tiến trình còn sống
      x-public: true
      responses:
        "200":
          description: Còn sống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      summary: Sẵn sàng nhận yêu cầu (database trả lời trong 1 s)
      x-public: true
      responses:
        "200":
          description: Sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database không trả lời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/deep:
    get:
      operationId: healthDeep
      summary: Kiểm sâu cho dịch vụ canh ngoài (Bearer HEALTH_TOKEN, Task 20); không có dữ liệu khách
      x-public: true
      responses:
        "200":
          description: Mọi chỉ số trong ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        "503":
          description: Có chỉ số quá ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users:
    get:
      operationId: listStaff
      summary: Mọi nhân viên của shop kèm vai trò theo phạm vi
      x-permission: identity.users.manage
      responses:
        "200":
          description: Nhân viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaff
      summary: Tạo nhân viên mới (chưa có vai trò nào)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: Nhân viên vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/grants:
    put:
      operationId: replaceStaffGrants
      summary: Thay toàn bộ vai trò theo phạm vi của một nhân viên (không tự sửa mình, không vượt quyền của mình)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGrantsRequest"
      responses:
        "200":
          description: Nhân viên sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/lock:
    post:
      operationId: lockStaff
      summary: Khóa nhân viên (không khóa Chủ còn hoạt động cuối cùng)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/unlock:
    post:
      operationId: unlockStaff
      summary: Mở khóa nhân viên
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi mở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles:
    get:
      operationId: listRoles
      summary: Vai trò của shop và quyền của từng vai trò
      x-permission: identity.users.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Người dùng đang đăng nhập và quyền của họ
      description: Chỉ cần đăng nhập và tài khoản không bị khóa (Task 315); nhân viên chưa có grant nhận grants rỗng.
      x-authenticated: true
      responses:
        "200":
          description: Người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/stream:
    get:
      operationId: stream
      summary: Báo hiệu thay đổi qua SSE (handler SSE riêng, Task 16)
      x-permission: realtime.subscribe
      responses:
        "200":
          description: Luồng sự kiện
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/uploads:
    post:
      operationId: createUpload
      summary: Xin đường dẫn ký sẵn để trình duyệt tải thẳng một tệp lên kho (chỉ mục đích nhận tải lên)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Tệp chờ tải lên và đường dẫn PUT ký sẵn (hạn 15 phút)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/complete:
    post:
      operationId: completeUpload
      summary: Báo đã tải xong; máy chủ kiểm kho rồi chuyển tệp sang uploaded (ảnh thì xếp việc xử lý)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tệp sau khi kiểm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Trạng thái tệp và các biến thể ảnh công khai
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Tệp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs:
    get:
      operationId: listJobs
      summary: Việc nền cần người xử lý của tenant người gọi (không có payload)
      x-permission: platform.jobs.manage
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [dead, in_doubt, expired]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Danh sách việc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Đưa việc dead, in_doubt hoặc expired về pending
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/abandon:
    post:
      operationId: abandonJob
      summary: Bỏ việc (chuyển sang expired)
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Tình trạng tiến trình, hàng đợi, sao lưu, lỗi và cảnh báo 24 giờ
      x-permission: platform.health.read
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: Danh sách mẫu (chưa xóa) của người bán, sửa gần nhất trước; lọc trạng thái, danh mục (gồm con), nhãn, tìm theo mã mẫu, SKU, barcode, tên không dấu; trang theo con trỏ
      description: >-
        warehouseId (không bắt buộc) thêm cột available (tổng có thể bán của các biến thể ở kho đó, có thể âm); cần
        thêm quyền inventory.read ở kho đó, không có → 403. Mẫu khớp q tối đa 1.000.
      x-permission: catalog.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              $ref: "#/components/schemas/ProductStatus"
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Một trang mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      summary: Tạo mẫu sản phẩm kèm biến thể màu/size (barcode để trống thì CRM tự sinh EAN-13)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Mẫu vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}:
    get:
      operationId: getProduct
      summary: Một mẫu kèm biến thể, bài viết dạng khối và HTML bài viết dựng sẵn (cả mẫu nháp, ngừng bán)
      x-permission: catalog.read
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: Mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Sửa tên, mô tả, bài viết, trạng thái của mẫu khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Mẫu sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/variants:
    post:
      operationId: addVariant
      summary: Thêm biến thể vào mẫu khi version của mẫu còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVariantRequest"
      responses:
        "201":
          description: Biến thể vừa thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/variants/search:
    get:
      operationId: searchVariants
      summary: Tìm biến thể của người bán theo barcode (đúng), SKU, mã mẫu (tiền tố), tên không dấu; barcode khớp trước
      x-permission: catalog.read
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Biến thể khớp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariantSearchHit"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/variants/{id}:
    patch:
      operationId: updateVariant
      summary: Sửa SKU, barcode, màu, size, giá, giá nhập, trạng thái của biến thể khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/VariantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariantRequest"
      responses:
        "200":
          description: Biến thể sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/categories:
    get:
      operationId: listCategories
      summary: Mọi danh mục của shop (cả đã lưu trữ) theo cấp, vị trí, tên; màn hình dựng cây từ parentId
      x-permission: catalog.read
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCategory
      summary: Tạo danh mục (tối đa 3 cấp; slug để trống thì sinh từ tên)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Danh mục vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Sửa tên, slug, vị trí, cha của danh mục khi version còn khớp (không thành con của chính nó, cả cây con tối đa 3 cấp)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/CategoryID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Danh mục sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Lưu trữ danh mục khi không còn danh mục con active hay mẫu active
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/CategoryID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Danh mục đã lưu trữ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/attributes:
    get:
      operationId: listAttributes
      summary: Mọi thuộc tính của shop kèm giá trị, theo vị trí
      x-permission: catalog.read
      responses:
        "200":
          description: Thuộc tính
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attribute"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAttribute
      summary: Tạo thuộc tính (mã chữ thường, không trùng)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
      responses:
        "201":
          description: Thuộc tính vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/attributes/{id}/values:
    post:
      operationId: addAttributeValue
      summary: Thêm giá trị vào thuộc tính (không trùng trong một thuộc tính)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/AttributeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttributeValueRequest"
      responses:
        "201":
          description: Giá trị vừa thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeValue"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/tags:
    get:
      operationId: listTags
      summary: Mọi nhãn kệ hàng của shop theo mã
      x-permission: catalog.read
      responses:
        "200":
          description: Nhãn
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTag
      summary: Tạo nhãn kệ hàng (mã chữ thường, không trùng)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Nhãn vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/classification:
    put:
      operationId: setProductClassification
      summary: Thay toàn bộ danh mục, giá trị thuộc tính, nhãn của mẫu khi version của mẫu còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetClassificationRequest"
      responses:
        "200":
          description: Phân loại sau khi thay (version mới của mẫu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductClassification"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/suppliers:
    get:
      operationId: listSuppliers
      summary: Nhà cung cấp theo tên (tối đa 200); q tìm theo tên bỏ dấu
      x-permission: inventory.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Nhà cung cấp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSupplier
      summary: Tạo nhà cung cấp (tên không trùng trong shop)
      x-permission: inventory.suppliers.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierRequest"
      responses:
        "201":
          description: Nhà cung cấp vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/suppliers/{id}:
    patch:
      operationId: updateSupplier
      summary: Sửa hoặc lưu trữ nhà cung cấp khi version còn khớp
      x-permission: inventory.suppliers.manage
      parameters:
        - $ref: "#/components/parameters/SupplierID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierRequest"
      responses:
        "200":
          description: Nhà cung cấp sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/documents:
    get:
      operationId: listStockDocuments
      summary: Phiếu kho mới nhất trước, của các kho người gọi được xem (lọc kho, trạng thái, loại; trang theo con trỏ)
      x-permission: inventory.read
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockDocumentStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockDocumentKind"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Một trang phiếu (không kèm dòng)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocumentPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStockDocument
      summary: Tạo phiếu kho nháp (nhập, xuất, hàng lỗi, xuất hàng lỗi, điều chỉnh); nhà cung cấp chỉ cho phiếu nhập
      x-permission: inventory.documents.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockDocumentRequest"
      responses:
        "201":
          description: Phiếu nháp vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocument"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/documents/{id}:
    get:
      operationId: getStockDocument
      summary: Một phiếu kho kèm dòng
      x-permission: inventory.read
      parameters:
        - $ref: "#/components/parameters/StockDocumentID"
      responses:
        "200":
          description: Phiếu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocument"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/documents/{id}/lines:
    put:
      operationId: replaceStockDocumentLines
      summary: Thay toàn bộ dòng của phiếu nháp khi version còn khớp
      x-permission: inventory.documents.create
      parameters:
        - $ref: "#/components/parameters/StockDocumentID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceStockDocumentLinesRequest"
      responses:
        "200":
          description: Phiếu sau khi thay dòng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocument"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/documents/{id}/post:
    post:
      operationId: postStockDocument
      summary: Ghi sổ phiếu nháp (đổi tồn); thiếu hàng ở một dòng thì cả phiếu không ghi (insufficient_stock)
      x-permission: inventory.documents.post
      parameters:
        - $ref: "#/components/parameters/StockDocumentID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockDocumentVersion"
      responses:
        "200":
          description: Phiếu đã ghi sổ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocument"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/documents/{id}/cancel:
    post:
      operationId: cancelStockDocument
      summary: Hủy phiếu nháp
      x-permission: inventory.documents.create
      parameters:
        - $ref: "#/components/parameters/StockDocumentID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockDocumentVersion"
      responses:
        "200":
          description: Phiếu đã hủy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocument"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Lên đơn nhập tay (tạo khách mới, đơn ở Đã xác nhận, giữ hàng cùng transaction)
      x-permission: order.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Đơn vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Một đơn kèm dòng đơn (tên, SKU chụp lúc đặt)
      x-permission: order.read
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Đơn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng của yêu cầu ghi (ADR-41); gửi lại cùng khóa trả cùng kết quả.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttributeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StockDocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Lỗi; không bao giờ có vết lỗi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, request_id]
      # Mọi mã `error` máy chủ có thể trả (Task 48). Màn hình phải có câu tiếng Việt cho từng mã
      # (console/src/app/errors.ts, test errors.test.ts đọc danh sách này); mọi hằng code* của
      # internal/httpapi/errors.go phải có ở đây (TestErrorCodes_DeclaredInContract). Mã của mốc sau được khai trước
      # theo kế hoạch; thêm mã mới thì thêm dòng ở đây và câu ở errors.ts.
      x-error-codes:
        # Chung (M0)
        - already_processed
        - bad_origin
        - bad_request
        - body_too_large
        - forbidden
        - idempotency_key_invalid
        - idempotency_key_required
        - idempotency_key_reused
        - internal
        - invalid_input
        - job_state_conflict
        - mfa_required
        - not_found
        - not_implemented
        - rate_limited
        - request_in_progress
        - retry_later
        - stream_unavailable
        - unauthenticated
        - unsupported_media_type
        - version_conflict
        # Nhân viên và vai trò (M1-26, M1-56)
        - cannot_modify_self
        - email_taken
        - grant_exceeds_actor
        - last_owner
        - owner_role_locked
        - role_archived
        - role_in_use
        - role_name_taken
        - unknown_permission
        # Sản phẩm, danh mục (M1-27, M1-34)
        - already_exists
        - barcode_taken
        - category_cycle
        - category_in_use
        - category_too_deep
        - code_taken
        - duplicate_option
        - invalid_article
        - invalid_price
        - not_for_sale
        - sku_taken
        # Kho (M1-28, M1-29, M1-35)
        - document_not_draft
        - insufficient_stock
        - stocktake_not_open
        - stocktake_open
        - supplier_archived
        - supplier_name_taken
        - supplier_not_for_kind
        # Đơn, vận chuyển (M1-30, M1-31)
        - mixed_sellers
        - out_of_stock
        - shipment_exists
        - total_overflow
        - variant_not_for_sale
        # Tệp, ảnh, nhập Excel (M1-41, M1-44, M1-47)
        - file_not_ready
        - file_purpose_not_allowed
        - file_too_large
        - file_type_not_allowed
        - import_not_ready
        - restore_expired
        - upload_missing
      properties:
        error:
          type: string
          description: Mã lỗi máy đọc được
        request_id:
          type: string
        variantId:
          type: string
          format: uuid
          description: Chỉ có ở insufficient_stock, out_of_stock — biến thể đầu tiên không đủ hàng
        available:
          type: integer
          format: int32
          description: Chỉ có ở insufficient_stock — số còn làm được của biến thể đó (xuất hàng lỗi là số hàng lỗi); ở out_of_stock — số có thể bán hiện tại
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
    DeepHealth:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        workerHeartbeatAgeS:
          type: integer
          format: int64
        ingestHeartbeatAgeS:
          type: integer
          format: int64
        oldestPendingAgeS:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        inDoubt:
          type: integer
          format: int64
        spoolFiles:
          type: integer
          format: int64
        lastWalArchivedAgeS:
          type: integer
          format: int64
        lastBackupAgeH:
          type: integer
          format: int64
    Scope:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [all, page, warehouse]
        id:
          type: string
    Grant:
      type: object
      required: [permission, scope]
      properties:
        permission:
          type: string
        scope:
          $ref: "#/components/schemas/Scope"
    Me:
      type: object
      required: [userId, email, grants]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        grants:
          type: array
          description: Chỉ grant có hiệu lực; quyền quản trị gán theo kho, theo Page nằm ở warnings (Task 315)
          items:
            $ref: "#/components/schemas/Grant"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScopeWarning"
    ScopeWarning:
      type: object
      description: Gán ở phạm vi hẹp hơn toàn shop có quyền quản trị; các quyền đó không có hiệu lực (Task 315)
      required: [code, message, scopeType, scopeId, permissions]
      properties:
        code:
          type: string
          enum: [admin_needs_shop_scope]
        message:
          type: string
        roleKey:
          type: string
          description: Vai trò của gán (có ở StaffMember; không có ở Me)
        scopeType:
          type: string
          enum: [all, page, warehouse]
        scopeId:
          type: string
        permissions:
          type: array
          items:
            type: string
    StaffGrant:
      type: object
      required: [roleKey, scopeType, scopeId]
      properties:
        roleKey:
          type: string
          minLength: 1
          maxLength: 64
        scopeType:
          type: string
          enum: [all, page, warehouse]
        scopeId:
          type: string
          maxLength: 128
          description: Mã đích (Page, kho); rỗng khi scopeType là all
    StaffMember:
      type: object
      required: [id, email, displayName, status, version, createdAt, grants]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [active, locked]
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: "#/components/schemas/StaffGrant"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScopeWarning"
    CreateStaffRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 200
    ReplaceGrantsRequest:
      type: object
      required: [version, grants]
      properties:
        version:
          type: integer
          format: int64
        grants:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffGrant"
    Role:
      type: object
      required: [key, name, status, customized, permissions]
      properties:
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        customized:
          type: boolean
        permissions:
          type: array
          items:
            type: string
    CreateUploadRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 64
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Tên gốc, chỉ để hiện và đặt tên khi tải về; không bao giờ vào khóa trên kho
        contentType:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    Upload:
      type: object
      required: [fileId, putUrl, headers, expiresAt]
      properties:
        fileId:
          type: string
          format: uuid
        putUrl:
          type: string
        headers:
          type: object
          description: Header phải gửi kèm PUT (đã nằm trong chữ ký)
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    FileVariant:
      type: object
      required: [width, format, url]
      properties:
        width:
          type: integer
          format: int32
        format:
          type: string
          enum: [avif, webp, jpeg]
        url:
          type: string
    FileInfo:
      type: object
      required: [id, purpose, status, variants]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
        status:
          type: string
          enum: [awaiting_upload, uploaded, processing, ready, rejected, lost]
        rejectReason:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        variants:
          type: array
          items:
            $ref: "#/components/schemas/FileVariant"
    Job:
      type: object
      required: [id, kind, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        attempts:
          type: integer
          format: int32
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
    ProcessHealth:
      type: object
      required: [role, lastHeartbeatAgeS]
      properties:
        role:
          type: string
        lastHeartbeatAgeS:
          type: integer
          format: int64
    QueueHealth:
      type: object
      required: [oldestPendingAgeS, pending, dead, inDoubt]
      properties:
        oldestPendingAgeS:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        inDoubt:
          type: integer
          format: int64
    IngestHealth:
      type: object
      required: [spoolFiles]
      properties:
        spoolFiles:
          type: integer
          format: int64
    BackupHealth:
      type: object
      properties:
        lastBaseAgeH:
          type: integer
          format: int64
        lastDrillAgeH:
          type: integer
          format: int64
        lastDrillOk:
          type: boolean
    ErrorSummary:
      type: object
      description: Một loại lỗi ứng dụng gộp theo dấu vân tay (Task 20). message đã lọc chuỗi từ 8 chữ số và email.
      required: [fingerprint, name, role, message, count, firstSeenAt, lastSeenAt]
      properties:
        fingerprint:
          type: string
        name:
          type: string
        role:
          type: string
        message:
          type: string
          maxLength: 300
        count:
          type: integer
          format: int64
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    AlertSummary:
      type: object
      required: [key, severity, sentAt]
      properties:
        key:
          type: string
        severity:
          type: string
          enum: [normal, urgent]
        sentAt:
          type: string
          format: date-time
    PlatformHealth:
      type: object
      required: [processes, queue, ingest, backup, errors, alerts]
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessHealth"
        queue:
          $ref: "#/components/schemas/QueueHealth"
        ingest:
          $ref: "#/components/schemas/IngestHealth"
        backup:
          $ref: "#/components/schemas/BackupHealth"
        errors:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ErrorSummary"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertSummary"
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customer, items, shipAddress, shippingFee]
      properties:
        customer:
          type: object
          additionalProperties: false
          required: [fullName]
          properties:
            fullName:
              type: string
              minLength: 1
              maxLength: 120
        warehouseId:
          type: string
          format: uuid
          description: Bỏ trống → kho chính
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [variantId, qty]
            properties:
              variantId:
                type: string
                format: uuid
              qty:
                type: integer
                format: int32
                minimum: 1
                maximum: 10000
        shipAddress:
          $ref: "#/components/schemas/ShipAddress"
        shippingFee:
          $ref: "#/components/schemas/Money"
    ShipAddress:
      type: object
      additionalProperties: false
      required: [name, phone, line]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          pattern: "^\\+?[0-9]{8,15}$"
        line:
          type: string
          minLength: 1
          maxLength: 500
    Order:
      type: object
      required: [id, code, status, customerId, subtotal, shippingFee, grandTotal, codAmount, items, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum: [draft, new, confirmed, cancel_requested, cancelled, delivered, returned]
        customerId:
          type: string
          format: uuid
        subtotal:
          $ref: "#/components/schemas/Money"
        shippingFee:
          $ref: "#/components/schemas/Money"
        grandTotal:
          $ref: "#/components/schemas/Money"
        codAmount:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderItem:
      type: object
      required: [id, position, variantId, sku, name, qty, unitPrice, netAmount]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        variantId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        qty:
          type: integer
          format: int32
        unitPrice:
          $ref: "#/components/schemas/Money"
        netAmount:
          $ref: "#/components/schemas/Money"
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Tiền, số nguyên đồng
    CatalogCode:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
      description: Mã mẫu hay SKU; CRM chuẩn hóa viết hoa
    Barcode:
      type: string
      pattern: "^[0-9A-Za-z-]{4,32}$"
    OptionText:
      type: string
      minLength: 1
