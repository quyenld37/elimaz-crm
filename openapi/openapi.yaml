      operationId: webAvailability
      summary: Còn/hết của tối đa 100 biến thể ở kho mặc định, hạn sống 5 s
      description: |
        Task 191 (M5-08). available = có thể bán > 0; low = có thể bán từ 1 tới 3. Phần đã giữ cho đơn và cho đợt flash
        sale không tính. Mã không có trong cửa hàng không có trong items. Chỉ để hiện; đặt hàng luôn kiểm lại tồn ở CRM.
        Bộ đệm từng biến thể 5 s, làm mới sớm hơn theo sự kiện tồn (stock.changed).
      x-auth: service_key
