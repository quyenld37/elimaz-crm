          description: >-
            validating: đang kiểm; invalid: có lỗi (errors); ready: xem trước được (summary), chờ áp dụng; duplicate:
            tệp cùng nội dung đã được áp (duplicateOf); applying: đang áp; applied: đã áp; failed: không đọc được
