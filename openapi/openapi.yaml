    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items, shippingFee]
      description: >-
        Đúng một trong customerId (khách có sẵn), customer (khách mới; SĐT đã là của hồ sơ khác thì khách mới không giữ số, đơn ghi cảnh báo phone_belongs_to_other_customer, Task 435). shipAddress bắt buộc khi
        không gửi intent (luật M1) và khi intent là confirmed.
      properties:
        customer:
          type: object
          additionalProperties: false
          required: [fullName]
          properties:
            fullName:
              type: string
              minLength: 1
              maxLength: 120
            phone:
              $ref: "#/components/schemas/PhoneInput"
            phoneIsCustomers:
              type: boolean
              description: true → SĐT là của khách (gắn thành danh tính); false → chỉ là SĐT người nhận
        customerId:
          type: string
          format: uuid
        phoneIsCustomers:
          type: boolean
          description: >-
            Chỉ đi cùng customerId (gửi cùng customer → 400 invalid_input). true → SĐT người nhận (shipAddress.phone) là
            của khách: gắn vào hồ sơ có sẵn nếu chưa ai giữ số đó (nhóm khác đang giữ → không gắn, đơn ghi cảnh báo
            phone_belongs_to_other_customer). Không gửi hay false → chỉ là SĐT người nhận của đơn (Task 435, A-05).
        intent:
          type: string
          description: Không gửi → hành vi M1 (tạo thẳng confirmed)
          enum: [draft, new, confirmed]
        warehouseId:
          type: string
          format: uuid
          description: >-
            Bỏ trống → kho chính. Kho (kể cả kho chính) phải nằm trong phạm vi order.create của người gọi (gán toàn
            shop hoặc theo đúng kho đó), không thì 403 forbidden (Task 411, docs/quyen.md)
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [variantId, qty]
            properties:
              variantId:
                type: string
                format: uuid
              qty:
                type: integer
                format: int32
                minimum: 1
                maximum: 10000
              lineDiscount:
                $ref: "#/components/schemas/Money"
        shipAddress:
          $ref: "#/components/schemas/ShipAddress"
        shippingFee:
          $ref: "#/components/schemas/Money"
        orderDiscount:
          $ref: "#/components/schemas/Money"
        couponCode:
          type: string
          minLength: 1
          maxLength: 32
        trafficSourceId:
          type: string
          format: uuid
        carrierNote:
          type: string
          maxLength: 500
          description: Ghi chú cho hãng vận chuyển (ghi chú nội bộ là addOrderNote)
        careBy:
          type: string
          format: uuid
          description: Nhân viên phụ trách
        conversationId:
          type: string
          format: uuid
          description: >-
            Lên đơn trong khung chat (M4, Task 176): đơn lưu hội thoại này; máy chủ tự lấy Page của hội thoại, người bán
            của Page (áp làm người bán của đơn, ADR-29) và kênh facebook (thay channel đã gửi). Cần conversation.read
            trên Page của hội thoại, không thì 404 not_found. Khách của đơn phải là customerId cùng nhóm hồ sơ với khách
            của hội thoại (Task 501); gửi customer (khách mới, tìm theo SĐT) hay customerId nhóm khác → 422
            conversation_customer_mismatch.
        channel:
          $ref: "#/components/schemas/OrderChannel"
        externalRef:
          type: string
          maxLength: 120
        referralRef:
          type: object
          maxProperties: 20
          description: Dấu giới thiệu (affiliate, P2); chỉ chuỗi
          additionalProperties:
            type: string
            maxLength: 200
