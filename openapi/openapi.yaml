      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebBirthdayRequest"
      responses:
        "200":
          description: Hồ sơ sinh nhật (mới hay đã có)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebBirthdayResult"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/birthdays/stop:
    post:
      operationId: webBirthdayStop
      summary: Khách bấm link dừng nhận tin sinh nhật; gọi lại giữ lúc dừng đầu tiên (Task 468)
      description: Mã dừng lạ → 404 not_found.
