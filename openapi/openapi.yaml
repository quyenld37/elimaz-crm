          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/OrderLabel"
          explode: true
        - name: status
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/OrderStatus"
          explode: true
        - name: pendingReason
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/PendingReason"
          explode: true
        - name: channel
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              $ref: "#/components/schemas/OrderChannel"
          explode: true
        - name: trafficSourceId
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
          explode: true
        - name: careBy
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          required: false
          description: 'Cả nhóm gốc của khách'
          schema:
            type: string
            format: uuid
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: 'Mã đơn DH…, SĐT người nhận (đủ hay đuôi) hoặc tên khách; không ghi vào log'
          schema:
            type: string
            maxLength: 100
        - name: duplicateSuspect
          in: query
          required: false
          schema:
            type: boolean
        - name: carrierKey
          in: query
          required: false
          description: 'Hãng của vận đơn hiện hành (M3, Task M3-28)'
          schema:
            type: string
            maxLength: 32
        - name: shipmentStatus
          in: query
          required: false
          description: 'Trạng thái vận đơn hiện hành (M3, Task M3-28)'
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/ShipmentStatus"
          explode: true
        - name: codState
          in: query
          required: false
          description: 'collecting = còn phải thu; holding = hãng đang giữ; received = shop đã nhận; none = không có COD (M3, Task M3-28)'
          schema:
            type: string
            enum: [collecting, holding, received, none]
        - name: packingStatus
          in: query
          required: false
          description: 'Trạng thái đóng gói (M3, Task M3-28)'
          schema:
            type: string
            enum: [none, picking, packed]
        - name: warehouseId
          in: query
          required: false
          description: 'Kho của đơn (màn Đóng gói, Task M3-45)'
          schema:
            type: string
            format: uuid
        - name: labelPrinted
