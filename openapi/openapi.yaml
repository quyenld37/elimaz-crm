# Hợp đồng API của CRM (kế hoạch M0 bản 5, Task 6). Đây là nguồn: mã máy chủ (ogen, internal/httpapi/gen), bảng
# route (tools/routegen -> internal/httpapi/routes_gen.go) và client của màn hình đều sinh từ tệp này (`make gen`).
# Luật: .claude/rules/openapi.md. Mỗi operation có đúng một trong `x-permission` hoặc `x-public: true`; mọi operation
# ghi có tham số IdempotencyKey. Thay đổi phá vỡ cần dòng trong openapi/breaking-approved.yaml (`make oasdiff`).
openapi: 3.0.3
info:
  title: CRM ELIMAZ
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Tiến trình còn sống
      x-public: true
      responses:
        "200":
          description: Còn sống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      summary: Sẵn sàng nhận yêu cầu (database trả lời trong 1 s)
      x-public: true
      responses:
        "200":
          description: Sẵn sàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database không trả lời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/deep:
    get:
      operationId: healthDeep
      summary: Kiểm sâu cho dịch vụ canh ngoài (Bearer HEALTH_TOKEN, Task 20); không có dữ liệu khách
      x-public: true
      responses:
        "200":
          description: Mọi chỉ số trong ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        "503":
          description: Có chỉ số quá ngưỡng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users:
    get:
      operationId: listStaff
      summary: Mọi nhân viên của shop kèm vai trò theo phạm vi
      x-permission: identity.users.manage
      responses:
        "200":
          description: Nhân viên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaff
      summary: Tạo nhân viên mới (chưa có vai trò nào)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: Nhân viên vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/grants:
    put:
      operationId: replaceStaffGrants
      summary: Thay toàn bộ vai trò theo phạm vi của một nhân viên (không tự sửa mình, không vượt quyền của mình)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceGrantsRequest"
      responses:
        "200":
          description: Nhân viên sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/lock:
    post:
      operationId: lockStaff
      summary: Khóa nhân viên (không khóa Chủ còn hoạt động cuối cùng)
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/users/{id}/unlock:
    post:
      operationId: unlockStaff
      summary: Mở khóa nhân viên
      x-permission: identity.users.manage
      parameters:
        - $ref: "#/components/parameters/StaffID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Nhân viên sau khi mở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles:
    get:
      operationId: listRoles
      summary: Vai trò của shop và quyền của từng vai trò
      x-permission: identity.users.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createRole
      summary: Tạo vai trò tự định nghĩa từ danh sách quyền có sẵn (người tạo phải có mọi quyền đó ở toàn shop)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Vai trò vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/manage:
    get:
      operationId: listRolesToManage
      summary: Vai trò của shop cho màn Vai trò (cùng dữ liệu listRoles, chỉ cần quyền quản lý vai trò)
      x-permission: identity.roles.manage
      responses:
        "200":
          description: Vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/{id}:
    put:
      operationId: updateRole
      summary: Sửa tên và quyền của vai trò (không sửa được vai trò Chủ; quyền thêm hay gỡ phải có ở toàn shop)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Vai trò sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/roles/{id}/archive:
    post:
      operationId: archiveRole
      summary: Lưu trữ vai trò không còn nhân viên đang hoạt động nào giữ (không lưu trữ được vai trò Chủ)
      x-permission: identity.roles.manage
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRoleRequest"
      responses:
        "200":
          description: Vai trò sau khi lưu trữ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/permissions:
    get:
      operationId: listPermissions
      summary: Mọi quyền của CRM kèm nhóm, nhãn tiếng Việt và loại phạm vi (để soạn vai trò)
      x-permission: identity.roles.manage
      responses:
        "200":
          description: Quyền, theo thứ tự của bảng quyền
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/service-keys:
    get:
      operationId: listServiceKeys
      summary: Khóa dịch vụ của website (không bao giờ kèm bí mật hay băm)
      x-permission: identity.service_keys.manage
      responses:
        "200":
          description: Khóa, cũ trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceKey"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createServiceKey
      summary: Tạo khóa dịch vụ cho website với các quyền web.*; khóa đầy đủ chỉ có trong câu trả lời này
      description: >-
        Gửi lại cùng Idempotency-Key → 409 already_processed (không tạo khóa thứ hai, không trả lại bí mật).
        Quyền ngoài web.* → 422 permission_not_allowed_for_key.
      x-permission: identity.service_keys.manage
      x-idempotency: no-replay
      x-idempotency-reason: "Trả bí mật của khóa đúng một lần"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceKeyRequest"
      responses:
        "201":
          description: Khóa vừa tạo kèm bí mật (secret), hiện một lần
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedServiceKey"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/identity/service-keys/{id}/revoke:
    post:
      operationId: revokeServiceKey
      summary: Thu hồi khóa dịch vụ (yêu cầu kế tiếp dùng khóa nhận 401 trong vài giây)
      x-permission: identity.service_keys.manage
      parameters:
        - $ref: "#/components/parameters/ServiceKeyID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeServiceKeyRequest"
      responses:
        "200":
          description: Khóa sau khi thu hồi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceKey"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Người dùng đang đăng nhập và quyền của họ
      description: Chỉ cần đăng nhập và tài khoản không bị khóa (Task 315); nhân viên chưa có grant nhận grants rỗng.
      x-authenticated: true
      responses:
        "200":
          description: Người dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/stream:
    get:
      operationId: stream
      summary: Báo hiệu thay đổi qua SSE (handler SSE riêng, Task 16)
      x-permission: realtime.subscribe
      responses:
        "200":
          description: Luồng sự kiện
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/uploads:
    post:
      operationId: createUpload
      summary: Xin đường dẫn ký sẵn để trình duyệt tải thẳng một tệp lên kho (chỉ mục đích nhận tải lên)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Tệp chờ tải lên và đường dẫn PUT ký sẵn (hạn 15 phút)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}/complete:
    post:
      operationId: completeUpload
      summary: Báo đã tải xong; máy chủ kiểm kho rồi chuyển tệp sang uploaded (ảnh thì xếp việc xử lý)
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tệp sau khi kiểm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/files/{id}:
    get:
      operationId: getFile
      summary: Trạng thái tệp và các biến thể ảnh công khai
      x-permission: files.upload
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Tệp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/regenerate:
    post:
      operationId: regenerateImages
      summary: Tạo lại kích thước ảnh từ ảnh gốc theo một bộ kích thước (một lệnh mỗi tệp ảnh ready chưa có bản đó; ảnh riêng tư không áp dụng)
      x-permission: platform.files.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateImagesRequest"
      responses:
        "200":
          description: Số lệnh mới xếp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateImagesResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/verify:
    post:
      operationId: verifyFiles
      summary: Kiểm lại mọi tệp ready trên kho tệp (lệnh file.verify nền, một lệnh mỗi tenant); tệp thiếu đối tượng thành lost
      x-permission: platform.files.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Đã nhận; việc chạy nền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyFilesAccepted"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/files/lost:
    get:
      operationId: listLostFiles
      summary: Tệp có trong CRM nhưng kho tệp không còn (status lost), mất gần nhất trước; trang theo con trỏ
      x-permission: platform.files.manage
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Trang tệp mất
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LostFilePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs:
    get:
      operationId: listJobs
      summary: Việc nền cần người xử lý của tenant người gọi (không có payload)
      x-permission: platform.jobs.manage
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [dead, in_doubt, expired]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Danh sách việc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Đưa việc dead, in_doubt hoặc expired về pending
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/jobs/{id}/abandon:
    post:
      operationId: abandonJob
      summary: Bỏ việc (chuyển sang expired)
      x-permission: platform.jobs.manage
      parameters:
        - $ref: "#/components/parameters/JobID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Việc sau khi đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/platform/health:
    get:
      operationId: getPlatformHealth
      summary: Tình trạng tiến trình, hàng đợi, sao lưu, lỗi và cảnh báo 24 giờ
      x-permission: platform.health.read
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformHealth"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: Danh sách mẫu (chưa xóa) của người bán, sửa gần nhất trước; lọc trạng thái, danh mục (gồm con), nhãn, tìm theo mã mẫu, SKU, barcode, tên không dấu; trang theo con trỏ
      description: >-
        warehouseId (không bắt buộc) thêm cột available (tổng có thể bán của các biến thể ở kho đó, có thể âm); cần
        thêm quyền inventory.read ở kho đó, không có → 403. Mẫu khớp q tối đa 1.000.
      x-permission: catalog.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              $ref: "#/components/schemas/ProductStatus"
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Một trang mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      summary: Tạo mẫu sản phẩm kèm biến thể màu/size (barcode để trống thì CRM tự sinh EAN-13)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Mẫu vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}:
    get:
      operationId: getProduct
      summary: Một mẫu kèm biến thể, bài viết dạng khối và HTML bài viết dựng sẵn (cả mẫu nháp, ngừng bán)
      x-permission: catalog.read
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200":
          description: Mẫu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Sửa tên, mô tả, bài viết, trạng thái của mẫu khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Mẫu sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/variants:
    post:
      operationId: addVariant
      summary: Thêm biến thể vào mẫu khi version của mẫu còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddVariantRequest"
      responses:
        "201":
          description: Biến thể vừa thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images:
    post:
      operationId: attachProductImage
      summary: Gắn tệp ảnh đã xử lý xong (mục đích product_image) vào cuối danh sách ảnh của mẫu khi version còn khớp
      description: >-
        color (không bắt buộc) là một màu đang có của biến thể trong mẫu. Tệp chưa ready hay không phải ảnh sản phẩm →
        409 file_not_ready; tệp đang gắn → 409 already_exists; tệp đã gắn rồi xóa → hồi lại ảnh cũ ở cuối. Tối đa 50 ảnh.
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachProductImageRequest"
      responses:
        "201":
          description: Mẫu sau khi gắn (kèm ảnh, version mới)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/order:
    put:
      operationId: reorderProductImages
      summary: Đặt thứ tự ảnh đang hiện của mẫu (đúng đủ mã ảnh đang hiện) khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderProductImagesRequest"
      responses:
        "200":
          description: Mẫu sau khi sắp lại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}:
    delete:
      operationId: deleteProductImage
      summary: Xóa mềm một ảnh của mẫu (khôi phục được trong 30 ngày); ảnh đã xóa thì không đổi gì
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Mẫu sau khi xóa ảnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}/color:
    put:
      operationId: setProductImageColor
      summary: Đặt màu của một ảnh đang hiện của mẫu khi version còn khớp (thiếu color → ảnh chung mọi màu)
      description: >-
        color phải là một màu đang có của biến thể trong mẫu (400 invalid_input nếu không). Ảnh đã xóa, của mẫu khác hay
        tenant khác → 404. Version mẫu tăng 1 như các thao tác ảnh khác.
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProductImageColorRequest"
      responses:
        "200":
          description: Mẫu sau khi đổi màu ảnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}/restore:
    post:
      operationId: restoreProductImage
      summary: Khôi phục ảnh đã xóa về vị trí cũ; quá 30 ngày → 410 restore_expired; ảnh đang hiện thì không đổi gì
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ImageID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Mẫu sau khi khôi phục ảnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/images/{imageId}/original:
    get:
      operationId: getOriginalImageURL
      summary: Đường dẫn tải ảnh gốc của một ảnh đang hiện, hạn 5 phút, tải về tên <mã mẫu>-<vị trí>.<đuôi> (TP05)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ImageID"
      responses:
        "200":
          description: Đường dẫn ký sẵn tới ảnh gốc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUrl"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/imports:
    post:
      operationId: createCatalogImport
      summary: Tạo bản nhập sản phẩm từ tệp Excel đã tải lên (mục đích catalog_import); kiểm chạy nền
      description: >-
        Tạo bản nhập ở trạng thái validating và xếp lệnh kiểm tệp (catalog.import.validate); đọc kết quả bằng
        getCatalogImport. Tệp không có, của shop khác, đã xóa → 404 not_found; sai mục đích hay chưa tải lên xong → 409
        file_not_ready. Bước áp dụng ở applyCatalogImport.
      x-permission: catalog.import
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogImportRequest"
      responses:
        "202":
          description: Bản nhập vừa tạo (validating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/imports/template:
    get:
      operationId: getCatalogImportTemplate
      summary: Tải tệp mẫu Excel sản phẩm (cột của mẫu, cột thuộc tính đang có, danh sách chọn danh mục và trạng thái)
      x-permission: catalog.import
      responses:
        "200":
          description: Tệp .xlsx
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/imports/{id}:
    get:
      operationId: getCatalogImport
      summary: Trạng thái, tóm tắt và lỗi từng dòng của một bản nhập
      x-permission: catalog.import
      parameters:
        - $ref: "#/components/parameters/ImportID"
      responses:
        "200":
          description: Bản nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/imports/{id}/apply:
    post:
      operationId: applyCatalogImport
      summary: Áp bản nhập ready (ghi tất cả hoặc không); việc chạy nền
      description: >-
        Chuyển bản nhập ready sang applying khi version còn khớp và xếp việc catalog.import.apply. Việc khóa và kiểm lại
        plan với dữ liệu hiện tại rồi ghi mọi mẫu, biến thể, phân loại trong một transaction: xong → applied; dữ liệu
        đổi từ lúc kiểm (SKU vừa bị mẫu khác lấy…) → failed với lỗi từng dòng, không ghi gì; tệp cùng nội dung vừa được
        áp → duplicate. Đọc kết quả bằng getCatalogImport. Bản nhập không ở ready → 409 import_not_ready; version cũ →
        409 version_conflict.
      x-permission: catalog.import
      parameters:
        - $ref: "#/components/parameters/ImportID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "202":
          description: Bản nhập applying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/variants/search:
    get:
      operationId: searchVariants
      summary: Tìm biến thể của người bán theo barcode (đúng), SKU, mã mẫu (tiền tố), tên không dấu; barcode khớp trước
      x-permission: catalog.read
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Biến thể khớp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariantSearchHit"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/variants/{id}:
    patch:
      operationId: updateVariant
      summary: Sửa SKU, barcode, màu, size, giá, giá nhập, trạng thái của biến thể khi version còn khớp
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/VariantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariantRequest"
      responses:
        "200":
          description: Biến thể sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/categories:
    get:
      operationId: listCategories
      summary: Mọi danh mục của shop (cả đã lưu trữ) theo cấp, vị trí, tên; màn hình dựng cây từ parentId
      x-permission: catalog.read
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCategory
      summary: Tạo danh mục (tối đa 3 cấp; slug để trống thì sinh từ tên)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Danh mục vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Sửa tên, slug, vị trí, cha của danh mục khi version còn khớp (không thành con của chính nó, cả cây con tối đa 3 cấp)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/CategoryID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Danh mục sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Lưu trữ danh mục khi không còn danh mục con active hay mẫu active
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/CategoryID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Danh mục đã lưu trữ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/attributes:
    get:
      operationId: listAttributes
      summary: Mọi thuộc tính của shop kèm giá trị, theo vị trí
      x-permission: catalog.read
      responses:
        "200":
          description: Thuộc tính
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attribute"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAttribute
      summary: Tạo thuộc tính (mã chữ thường, không trùng)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
      responses:
        "201":
          description: Thuộc tính vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/attributes/{id}/values:
    post:
      operationId: addAttributeValue
      summary: Thêm giá trị vào thuộc tính (không trùng trong một thuộc tính)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/AttributeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttributeValueRequest"
      responses:
        "201":
          description: Giá trị vừa thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeValue"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/tags:
    get:
      operationId: listTags
      summary: Mọi nhãn kệ hàng của shop theo mã
      x-permission: catalog.read
      responses:
        "200":
          description: Nhãn
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTag
      summary: Tạo nhãn kệ hàng (mã chữ thường, không trùng)
      x-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Nhãn vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/catalog/products/{id}/classification:
    get:
      operationId: getProductClassification
      summary: Danh mục, giá trị thuộc tính, nhãn đang gán cho mẫu và version hiện tại của mẫu (màn sửa mẫu)
