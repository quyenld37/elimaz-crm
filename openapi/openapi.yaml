      operationId: listSuppliers
      summary: Nhà cung cấp theo tên (tối đa 200); q tìm theo tên bỏ dấu
      x-permission: inventory.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Nhà cung cấp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSupplier
      summary: Tạo nhà cung cấp (tên không trùng trong shop)
      x-permission: inventory.suppliers.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierRequest"
      responses:
        "201":
          description: Nhà cung cấp vừa tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/suppliers/{id}:
    patch:
      operationId: updateSupplier
      summary: Sửa hoặc lưu trữ nhà cung cấp khi version còn khớp
      x-permission: inventory.suppliers.manage
      parameters:
        - $ref: "#/components/parameters/SupplierID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierRequest"
      responses:
        "200":
          description: Nhà cung cấp sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/warehouses:
    get:
      operationId: listWarehouses
      summary: Các kho người gọi được xem (có inventory.read ở kho đó hoặc toàn shop), kho chính trước rồi theo mã; gồm cả kho đã đóng
      x-permission: inventory.read
      responses:
        "200":
          description: Danh sách kho
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/balances:
    get:
      operationId: listBalances
      summary: Số dư từng biến thể ở một kho (tồn, lỗi, đang giữ, đang giao, có thể bán), biến thể mới tạo trước; lọc "Thiếu so với phần giữ", tìm theo barcode, SKU, mã mẫu, tên không dấu; trang theo con trỏ
      description: >-
        Cần inventory.read ở đúng kho warehouseId, không có → 403. Chỉ biến thể đã có dòng số dư ở kho đó. available =
        onHand − damaged − held − inTransit, có thể âm sau kiểm kho đếm thiếu (Q8); onlyShort=true chỉ trả dòng
        available < 0. Biến thể khớp q tối đa 100.
      x-permission: inventory.read
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: onlyShort
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Một trang số dư
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancePage"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/documents:
    get:
      operationId: listStockDocuments
      summary: Phiếu kho mới nhất trước, của các kho người gọi được xem (lọc kho, trạng thái, loại; trang theo con trỏ)
      x-permission: inventory.read
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockDocumentStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockDocumentKind"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Một trang phiếu (không kèm dòng)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDocumentPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createStockDocument
      summary: Tạo phiếu kho nháp (nhập, xuất, hàng lỗi, xuất hàng lỗi, điều chỉnh); nhà cung cấp chỉ cho phiếu nhập
      x-permission: inventory.documents.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockDocumentRequest"
