      summary: Tải tệp mẫu Excel sản phẩm (cột của mẫu, cột thuộc tính đang có, danh sách chọn danh mục và trạng thái)
      x-permission: catalog.import
      responses:
        "200":
          description: Tệp .xlsx
          headers:
            Content-Disposition:
              schema:
                type: string
