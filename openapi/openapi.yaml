      x-permission: web.catalog.read
      parameters:
        - name: linkKey
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9A-Fa-f]{8}$"
      responses:
        "200":
          description: Bộ phối
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebLook"
