        available:
          type: integer
          format: int32
          description: Chỉ có ở insufficient_stock — số còn làm được của biến thể đó (xuất hàng lỗi là số hàng lỗi, không quá phần trên kệ); ở out_of_stock — số có thể bán hiện tại; ở stock_short — tồn thực còn cho dòng giữ hàng bị chặn (kiểm kho đã ghi thấp hơn phần giữ)
        ownerId:
          type: string
          format: uuid
          description: Chỉ có ở identity_taken — gốc của khách đang giữ danh tính
        blockingMergeId:
          type: string
          format: uuid
          description: Chỉ có ở merge_not_latest — lần gộp phải hoàn tác trước
