        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/stocktakes:
    post:
      operationId: startStocktake
      summary: Mở phiên kiểm kho ở một kho (một phiên mở mỗi kho; kho đã đóng → invalid_input)
      x-permission: inventory.stocktake
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartStocktakeRequest"
      responses:
        "201":
          description: Phiên đã mở
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stocktake"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/stocktakes/{id}:
    get:
      operationId: getStocktake
      summary: Phiên kiểm kho kèm dòng đếm và xem trước chênh lệch
      x-permission: inventory.read
      parameters:
        - $ref: "#/components/parameters/StocktakeID"
      responses:
        "200":
          description: Phiên kiểm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stocktake"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/stocktakes/{id}/lines/{variantId}:
    put:
      operationId: recordStocktakeCount
      summary: Ghi số đếm của một biến thể (chụp tồn trên kệ = on_hand − in_transit lúc ghi); ghi lại cần lineVersion
      x-permission: inventory.stocktake
      parameters:
        - $ref: "#/components/parameters/StocktakeID"
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordStocktakeCountRequest"
      responses:
        "200":
          description: Dòng đếm sau khi ghi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeLine"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/stocktakes/{id}/apply:
    post:
      operationId: applyStocktake
      summary: Áp dụng phiên (cộng chênh lệch vào tồn, không đụng phần giữ); trả danh sách thiếu so với phần giữ
      x-permission: inventory.stocktake.apply
      parameters:
        - $ref: "#/components/parameters/StocktakeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Phiên đã áp dụng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyStocktakeResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/inventory/stocktakes/{id}/cancel:
    post:
      operationId: cancelStocktake
      summary: Hủy phiên đang mở (tồn không đổi)
      x-permission: inventory.stocktake
      parameters:
        - $ref: "#/components/parameters/StocktakeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: Phiên đã hủy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stocktake"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống trùng của yêu cầu ghi (ADR-41); gửi lại cùng khóa trả cùng kết quả.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageID:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttributeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShipmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StockDocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StocktakeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Lỗi; không bao giờ có vết lỗi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, request_id]
      # Mọi mã `error` máy chủ có thể trả (Task 48). Màn hình phải có câu tiếng Việt cho từng mã
      # (console/src/app/errors.ts, test errors.test.ts đọc danh sách này); mọi hằng code* của
      # internal/httpapi/errors.go phải có ở đây (TestErrorCodes_DeclaredInContract). Mã của mốc sau được khai trước
      # theo kế hoạch; thêm mã mới thì thêm dòng ở đây và câu ở errors.ts.
      x-error-codes:
        # Chung (M0)
        - already_processed
        - bad_origin
        - bad_request
        - body_too_large
        - forbidden
        - idempotency_key_invalid
        - idempotency_key_required
        - idempotency_key_reused
        - internal
        - invalid_input
        - job_state_conflict
        - mfa_required
        - not_found
        - not_implemented
        - rate_limited
        - request_in_progress
        - retry_later
        - stream_unavailable
        - unauthenticated
        - unsupported_media_type
        - version_conflict
        # Nhân viên và vai trò (M1-26, M1-56)
        - cannot_modify_self
        - email_taken
        - grant_exceeds_actor
        - last_owner
        - owner_role_locked
        - role_archived
        - role_in_use
        - role_name_taken
        - unknown_permission
        # Sản phẩm, danh mục (M1-27, M1-34)
        - already_exists
        - barcode_taken
        - category_cycle
        - category_in_use
        - category_too_deep
        - code_taken
        - duplicate_option
        - invalid_article
        - invalid_price
        - not_for_sale
        - sku_taken
        # Kho (M1-28, M1-29, M1-35)
        - document_not_draft
        - insufficient_stock
        - stocktake_not_open
        - stocktake_open
        - supplier_archived
        - supplier_name_taken
        - supplier_not_for_kind
        # Đơn, vận chuyển (M1-30, M1-31)
        - mixed_sellers
        - out_of_stock
        - shipment_exists
        - total_overflow
        - variant_not_for_sale
        # Tệp, ảnh, nhập Excel (M1-41, M1-44, M1-47)
        - file_not_ready
        - file_purpose_not_allowed
        - file_too_large
        - file_type_not_allowed
        - import_not_ready
        - restore_expired
        - unknown_preset
        - upload_missing
      properties:
        error:
          type: string
          description: Mã lỗi máy đọc được
        request_id:
          type: string
        variantId:
          type: string
          format: uuid
          description: Chỉ có ở insufficient_stock, out_of_stock — biến thể đầu tiên không đủ hàng
        available:
          type: integer
          format: int32
          description: Chỉ có ở insufficient_stock — số còn làm được của biến thể đó (xuất hàng lỗi là số hàng lỗi); ở out_of_stock — số có thể bán hiện tại
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
    DeepHealth:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        workerHeartbeatAgeS:
          type: integer
          format: int64
        ingestHeartbeatAgeS:
          type: integer
          format: int64
        oldestPendingAgeS:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        inDoubt:
          type: integer
          format: int64
        spoolFiles:
          type: integer
          format: int64
        lastWalArchivedAgeS:
          type: integer
          format: int64
        lastBackupAgeH:
          type: integer
          format: int64
    Scope:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [all, page, warehouse]
        id:
          type: string
    Grant:
      type: object
      required: [permission, scope]
      properties:
        permission:
          type: string
        scope:
          $ref: "#/components/schemas/Scope"
    Me:
      type: object
      required: [userId, email, grants]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        grants:
          type: array
          description: Chỉ grant có hiệu lực; quyền quản trị gán theo kho, theo Page nằm ở warnings (Task 315)
          items:
            $ref: "#/components/schemas/Grant"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScopeWarning"
    ScopeWarning:
      type: object
      description: Gán ở phạm vi hẹp hơn toàn shop có quyền quản trị; các quyền đó không có hiệu lực (Task 315)
      required: [code, message, scopeType, scopeId, permissions]
      properties:
        code:
          type: string
          enum: [admin_needs_shop_scope]
        message:
          type: string
        roleKey:
          type: string
          description: Vai trò của gán (có ở StaffMember; không có ở Me)
        scopeType:
          type: string
          enum: [all, page, warehouse]
        scopeId:
          type: string
        permissions:
          type: array
          items:
            type: string
    StaffGrant:
      type: object
      required: [roleKey, scopeType, scopeId]
      properties:
        roleKey:
          type: string
          minLength: 1
          maxLength: 64
        scopeType:
          type: string
          enum: [all, page, warehouse]
        scopeId:
          type: string
          maxLength: 128
          description: Mã đích (Page, kho); rỗng khi scopeType là all
    StaffMember:
      type: object
      required: [id, email, displayName, status, version, createdAt, grants]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [active, locked]
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: "#/components/schemas/StaffGrant"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ScopeWarning"
    CreateStaffRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 200
    ReplaceGrantsRequest:
      type: object
      required: [version, grants]
      properties:
        version:
          type: integer
          format: int64
        grants:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffGrant"
    Role:
      type: object
      required: [id, key, name, status, customized, version, holderCount, permissions]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        customized:
          type: boolean
          description: Vai trò mẫu đã bị sửa hoặc vai trò tự tạo; bản cập nhật sau không tự thêm quyền vào
        version:
          type: integer
          format: int64
        holderCount:
          type: integer
          format: int64
          description: Số nhân viên đang hoạt động có ít nhất một gán của vai trò này
        permissions:
          type: array
          items:
            type: string
    CreateRoleRequest:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 100
    UpdateRoleRequest:
      type: object
      required: [version, name, permissions]
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 100
    ArchiveRoleRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
    PermissionInfo:
      type: object
      required: [key, scopeType, group, label]
      properties:
        key:
          type: string
        scopeType:
          type: string
          enum: [none, shop, warehouse, page]
          description: none = toàn shop từ gán bất kỳ; shop = quyền quản trị, chỉ hiệu lực khi gán toàn shop; warehouse, page = theo kho, theo Page
        group:
          type: string
        label:
          type: string
    CreateCatalogImportRequest:
      type: object
      additionalProperties: false
      required: [fileId]
      properties:
        fileId:
          type: string
          format: uuid
          description: Tệp .xlsx đã tải lên bằng createUpload (purpose catalog_import) và completeUpload
    CatalogImport:
      type: object
      required: [id, fileId, status, summary, errors, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        status:
          type: string
          enum: [validating, invalid, ready, applying, applied, duplicate, failed]
          description: >-
            validating: đang kiểm; invalid: có lỗi (errors); ready: xem trước được (summary), chờ áp dụng; duplicate:
            tệp cùng nội dung đã được áp (duplicateOf); failed: không đọc được tệp hay áp thất bại
        summary:
          $ref: "#/components/schemas/CatalogImportSummary"
        errors:
          type: array
          description: Lỗi theo dòng, xếp theo dòng rồi cột (tối đa 1.000; tổng số ở summary.errors)
          items:
            $ref: "#/components/schemas/CatalogImportError"
        duplicateOf:
          type: string
          format: uuid
          description: Bản nhập đã áp cùng tệp (chỉ khi duplicate)
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CatalogImportSummary:
      type: object
      required: [models, create, update, unchanged]
      properties:
        models:
          type: integer
          format: int32
          description: Số mẫu trong tệp (ready)
        create:
          type: integer
          format: int32
          description: Số biến thể sẽ tạo
        update:
          type: integer
          format: int32
          description: Số biến thể có sẵn sẽ sửa
        unchanged:
          type: integer
          format: int32
          description: Số biến thể có sẵn giữ nguyên
        errors:
          type: integer
          format: int32
          description: Tổng số lỗi (invalid)
    CatalogImportError:
      type: object
      required: [row, column, code, message]
      properties:
        row:
          type: integer
          format: int32
          description: Dòng Excel (0 là lỗi của cả tệp)
        column:
          type: string
          description: Tiêu đề cột (rỗng là lỗi của cả dòng hay cả tệp)
        code:
          type: string
          description: Mã lỗi (missing_required, invalid_price, …, file_not_xlsx, header_mismatch)
        message:
          type: string
          description: Câu tiếng Việt cho nhân viên; không chép nội dung ô dài quá 50 ký tự
    RegenerateImagesRequest:
      type: object
      additionalProperties: false
      required: [presetVersion]
      properties:
        presetVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Bản bộ kích thước (như IMAGE_PRESET_VERSION); chưa có trong bảng của máy chủ → 422 unknown_preset
    RegenerateImagesResult:
      type: object
      required: [enqueued]
      properties:
        enqueued:
          type: integer
          format: int32
          description: Số lệnh file.regenerate mới xếp (tệp đã có lệnh cho bản này không tính)
    CreateUploadRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      additionalProperties: false
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 64
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Tên gốc, chỉ để hiện và đặt tên khi tải về; không bao giờ vào khóa trên kho
        contentType:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    Upload:
      type: object
      required: [fileId, putUrl, headers, expiresAt]
      properties:
        fileId:
          type: string
          format: uuid
        putUrl:
          type: string
        headers:
          type: object
          description: Header phải gửi kèm PUT (đã nằm trong chữ ký)
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    SignedUrl:
      type: object
      description: Đường dẫn GET ký sẵn có hạn tới một tệp trên kho
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
    FileVariant:
      type: object
      required: [width, format, url]
      properties:
        width:
          type: integer
          format: int32
        format:
          type: string
          enum: [avif, webp, jpeg]
        url:
          type: string
    FileInfo:
      type: object
      required: [id, purpose, status, variants]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
        status:
          type: string
          enum: [awaiting_upload, uploaded, processing, ready, rejected, lost]
        rejectReason:
          type: string
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        variants:
          type: array
          items:
            $ref: "#/components/schemas/FileVariant"
    Job:
      type: object
      required: [id, kind, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        attempts:
          type: integer
          format: int32
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
    ProcessHealth:
      type: object
      required: [role, lastHeartbeatAgeS]
      properties:
        role:
          type: string
        lastHeartbeatAgeS:
          type: integer
          format: int64
    QueueHealth:
      type: object
      required: [oldestPendingAgeS, pending, dead, inDoubt]
      properties:
        oldestPendingAgeS:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        dead:
          type: integer
          format: int64
        inDoubt:
          type: integer
          format: int64
    IngestHealth:
      type: object
      required: [spoolFiles]
      properties:
        spoolFiles:
          type: integer
          format: int64
    BackupHealth:
      type: object
      properties:
        lastBaseAgeH:
          type: integer
          format: int64
        lastDrillAgeH:
          type: integer
          format: int64
        lastDrillOk:
          type: boolean
    ErrorSummary:
      type: object
      description: Một loại lỗi ứng dụng gộp theo dấu vân tay (Task 20). message đã lọc chuỗi từ 8 chữ số và email.
      required: [fingerprint, name, role, message, count, firstSeenAt, lastSeenAt]
      properties:
        fingerprint:
          type: string
        name:
          type: string
        role:
          type: string
        message:
          type: string
          maxLength: 300
        count:
          type: integer
          format: int64
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    AlertSummary:
      type: object
      required: [key, severity, sentAt]
      properties:
        key:
          type: string
        severity:
          type: string
          enum: [normal, urgent]
        sentAt:
          type: string
          format: date-time
    PlatformHealth:
      type: object
      required: [processes, queue, ingest, backup, errors, alerts]
      properties:
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessHealth"
        queue:
          $ref: "#/components/schemas/QueueHealth"
        ingest:
          $ref: "#/components/schemas/IngestHealth"
        backup:
          $ref: "#/components/schemas/BackupHealth"
        errors:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ErrorSummary"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertSummary"
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customer, items, shipAddress, shippingFee]
      properties:
        customer:
          type: object
          additionalProperties: false
          required: [fullName]
          properties:
            fullName:
              type: string
              minLength: 1
              maxLength: 120
        warehouseId:
          type: string
          format: uuid
          description: Bỏ trống → kho chính
        items:
          type: array
          minItems: 1
          maxItems: 100
