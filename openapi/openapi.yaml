      description: |
        Task 453 (M5-41). Website tự lấy mẫu, giá cho banner từ API danh mục, chiến dịch (như resolveBanners cũ).
        Bộ đệm 60 s, làm mới sớm hơn theo sự kiện content.banners.changed, promotion.web_campaign.changed.
