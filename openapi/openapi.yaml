      description: |
        Tạm dừng chỉ chặn đơn website gửi thẳng (submittedVia = sync) bắt đầu sau khi lệnh này commit: webCreateOrder
        trả 503 web_orders_paused. Đơn từ hàng đợi của website (queued) và đơn đã có của cùng externalRef vẫn nhận.
        Mở lại không cần lý do (gửi rỗng thì xóa lý do cũ).
      x-permission: order.web_intake.manage
      parameters:
