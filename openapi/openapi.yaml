      operationId: getSalesDashboard
      summary: 'Tổng quan: đơn lên, doanh số tiền hàng, hủy, thành công, hoàn, khách trả, chờ xử lý, theo kênh, theo ngày (BC01, Task M6-06)'
      x-permission: report.sales.read
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: getSalesDashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesDashboardResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/reports/sales/orders:
    get:
      operationId: getSalesOrdersReport
      summary: 'Báo cáo đơn theo trạng thái, nguồn, nhân viên, kênh, Page, hãng, ngày (BC02, Task M6-07)'
