  responses:
    Error:
      description: Lỗi; không bao giờ có vết lỗi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, request_id]
      # Mọi mã `error` máy chủ có thể trả (Task 48). Màn hình phải có câu tiếng Việt cho từng mã
      # (console/src/app/errors.ts, test errors.test.ts đọc danh sách này); mọi hằng code* của
      # internal/httpapi/errors.go phải có ở đây (TestErrorCodes_DeclaredInContract). Mã của mốc sau được khai trước
      # theo kế hoạch; thêm mã mới thì thêm dòng ở đây và câu ở errors.ts.
      x-error-codes:
        # Chung (M0)
        - already_processed
        - bad_origin
        - bad_request
        - body_too_large
        - forbidden
        - idempotency_key_invalid
        - idempotency_key_required
        - idempotency_key_reused
        - internal
        - invalid_input
        - job_state_conflict
        - mfa_required
        - not_found
        - not_implemented
        - rate_limited
        - request_in_progress
        - retry_later
        - stream_unavailable
        - unauthenticated
        - unsupported_media_type
        - version_conflict
        # Nhân viên và vai trò (M1-26, M1-56)
        - cannot_modify_self
        - email_taken
        - grant_exceeds_actor
        - last_owner
        - owner_role_locked
        - role_archived
        - role_in_use
        - role_name_taken
        - unknown_permission
        # Sản phẩm, danh mục (M1-27, M1-34)
        - already_exists
        - barcode_taken
        - category_cycle
        - category_in_use
        - category_too_deep
        - code_taken
        - duplicate_option
        - invalid_article
        - invalid_price
        - not_for_sale
        - sku_taken
        # Kho (M1-28, M1-29, M1-35)
        - document_not_draft
        - insufficient_stock
        - stocktake_not_open
        - stocktake_open
        - supplier_archived
        - supplier_name_taken
        - supplier_not_for_kind
        # Đơn, vận chuyển (M1-30, M1-31)
        - mixed_sellers
        - out_of_stock
        - shipment_exists
        - total_overflow
        - variant_not_for_sale
        # Tệp, ảnh, nhập Excel (M1-41, M1-44, M1-47)
        - file_not_ready
        - file_purpose_not_allowed
        - file_too_large
        - file_type_not_allowed
        - import_not_ready
        - restore_expired
        - unknown_preset
        - upload_missing
        # Khách, đơn, mã giảm giá (M2, Task M2-02)
        - address_incomplete
        - coupon_locked_after_use
        - coupon_rejected
        - discount_needs_approval
        - identity_taken
        - import_file_invalid
        - import_too_large
        - invalid_phone
        - invalid_tag_rule
        - invalid_transition
        - line_discount_exceeds
        - max_uses_below_used
        - merge_not_latest
        - merge_same_customer
        - merge_window_expired
        - needs_approval
        - order_discount_exceeds
        - order_locked_by_shipment
        - query_too_short
        - return_not_allowed
        - return_qty_exceeds
        - setting_out_of_range
        - shipment_already_attached
        - traffic_source_inactive
        - unknown_admin_unit
        - variant_not_found
        - ward_not_in_province
      properties:
        error:
          type: string
          description: Mã lỗi máy đọc được
        request_id:
          type: string
        variantId:
          type: string
          format: uuid
          description: Chỉ có ở insufficient_stock, out_of_stock — biến thể đầu tiên không đủ hàng
        available:
          type: integer
          format: int32
          description: Chỉ có ở insufficient_stock — số còn làm được của biến thể đó (xuất hàng lỗi là số hàng lỗi); ở out_of_stock — số có thể bán hiện tại
        ownerId:
          type: string
          format: uuid
          description: Chỉ có ở identity_taken — gốc của khách đang giữ danh tính
        blockingMergeId:
          type: string
          format: uuid
          description: Chỉ có ở merge_not_latest — lần gộp phải hoàn tác trước
        reason:
          $ref: "#/components/schemas/CouponRejectReason"
    HealthStatus:
      type: object
      required: [status]
