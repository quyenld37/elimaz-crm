      summary: Nhập hồ sơ sinh nhật cũ của website giữ nguyên mã dừng nhận tin (tối đa 500 mỗi lần) (Task 491)
      description: |
        Mỗi mục: tìm khách theo SĐT (chưa có → tạo khách mới, tên trống → "Khách website"); khách chưa có hồ sơ → hồ sơ
        nguồn import giữ stopToken (link dừng cũ vẫn dùng được với webBirthdayStop), savedAt, stoppedAt,
        legacyDelivered (inserted). Khách đã có hồ sơ cùng mã dừng → skipped. Khách đã có hồ sơ với mã khác (đăng ký
        lần đầu thắng) hay mã dừng đã thuộc khách khác → vị trí mục (từ 0) trong conflicts, không đổi hồ sơ; riêng
        stoppedAt của website vẫn dừng hồ sơ của khách đó. stopped: số hồ sơ đang dừng do lần nhập này. SĐT, mã dừng
        trùng trong lần nhập, ngày sai, mail mà không email → 400 invalid_input; SĐT sai → 422 invalid_phone; không nhập
        mục nào.
      x-auth: service_key
      x-permission: web.birthdays.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebBirthdayImportRequest"
      responses:
        "200":
          description: Kết quả nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebBirthdayImportReport"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/coupons/import:
    post:
      operationId: webImportCoupons
      summary: Nhập mã còn hạn của website (tối đa 500 mỗi lần); mã đã có cùng điều khoản bỏ qua, khác điều khoản báo xung đột (Task 197)
      description: |
        Mỗi mã dùng một lần, chỉ kênh web, lô loại imported theo batchName (trống → "Mã nhập từ website"). percent:
        value là phần trăm nguyên 1–100 của website (CRM lưu phần vạn). used true → mã đã dùng hết. Mã trùng trong
        cùng lần nhập hay điều khoản sai → 400 invalid_input, không nhập mã nào. boundPhone (Task 491, tùy chọn): mã
        chỉ dùng cho đơn của SĐT đó (mã sinh nhật); là một phần điều khoản khi nhập lại (khác → conflicts); SĐT sai → 422
        invalid_phone.
      x-auth: service_key
      x-permission: web.coupons.issue
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebCouponImportRequest"
      responses:
        "200":
          description: Kết quả nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCouponImportReport"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/orders:
    post:
      operationId: webCreateOrder
      summary: Tạo đơn từ website (CRM tính lại giá, chiến dịch, mã; giữ hàng); kết quả và từ chối dứt khoát được lưu theo khóa
      description: |
        Task 194 (M5-11). Quy ước của website: Idempotency-Key = externalRef. Một đơn cho mỗi externalRef (khóa nghiệp
        vụ): gửi lại với khóa khác cùng externalRef → 201 cùng orderId. SĐT người đặt chuẩn hóa về +84… (sai → 422
        invalid_phone); quá ngưỡng đơn của một SĐT (web_order_customer, QĐ23) → 429 too_fast kèm Retry-After, không
        lưu. Lưu theo khóa (gửi lại cùng khóa trả nguyên câu trả lời, Idempotent-Replayed: true): 201; 422
        quote_changed (kèm quote: báo giá CRM hiện tại; chỉ khi submittedVia = sync), item_unavailable (kèm
        variantIds), coupon_invalid (kèm reason; chỉ khi sync), mixed_sellers; 409 out_of_stock (kèm variantId,
        available). queued: giá hay mã lệch vẫn tạo theo số CRM, priceReview = true. Tạm bận → 503 retry_later kèm
        Retry-After, không lưu. Shop đang tạm dừng nhận đơn web (Task 456) và đơn gửi thẳng (sync) chưa có → 503
        web_orders_paused, không Retry-After, không lưu (mở lại rồi gửi lại cùng khóa thì xử lý lại); queued vẫn nhận.
        Có couponCode mà SĐT người đặt hay IP (clientIp; không gửi → khóa dịch vụ) đã quá ngưỡng nhập mã sai (Task
        482, như webQuote) → 429 coupon_attempts_exceeded kèm Retry-After, không lưu; 422 coupon_invalid not_found,
        bound_other được đếm là một lần sai. shippingChoice (Task 490, tùy chọn): kiểm như webQuote, thêm mã tỉnh,
        phường của quote phải trùng shipAddress; sync sai → 422 shipping_carrier_unavailable / shipping_fee_mismatch
        (lưu theo khóa), chưa kiểm được → 503 retry_later (không lưu); queued vẫn tạo, priceReview = true. Đơn đã có
        của cùng externalRef trả 201 trước mọi kiểm lựa chọn. Lựa chọn lưu trên đơn (Order.webShipping).
      x-auth: service_key
      x-permission: web.orders.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebOrderRequest"
      responses:
        "201":
          description: Đơn đã tạo, hoặc đơn đã có của cùng externalRef
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebOrderCreated"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/shipping/carriers:
    get:
      operationId: webShippingCarriers
      summary: Hãng giao hàng hiện trên website (ưu tiên đứng đầu, còn lại theo thứ tự shop đặt); hạn sống 60 s
      description: |
        Task 198 (M5-15). Chỉ mã tài khoản, khóa hãng, tên. Bộ đệm 60 s (đổi showOnWeb ở CRM tới website trong ≤ 60 s);
        lưu cài đặt hãng trên web làm mới sớm hơn (sự kiện carrier.web_settings_changed).
      x-auth: service_key
      x-permission: web.shipping.quote
      responses:
        "200":
          description: Hãng trên website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebShippingCarriers"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/shipping/quote:
    post:
      operationId: webShippingQuote
      summary: Báo phí giao hàng cho giỏ website theo tỉnh, phường, khối lượng, giá trị; không ghi gì
      description: |
        Task 198 (M5-15). CRM gọi các hãng hiện trên web song song, ngoài transaction, hạn 3 s mỗi hãng; hãng lỗi hay quá
        hạn bị bỏ. Một lựa chọn mỗi dịch vụ, ưu tiên trước rồi rẻ trước. Không hãng nào báo được (ví dụ tài khoản nhập
        tay khi tích hợp hãng đang tạm dừng): có phí dự phòng → một lựa chọn estimated = true (không hãng); không có →
        503 retry_later. Bộ đệm 10 phút theo (tỉnh, phường, khối lượng làm tròn lên 250 g, giá trị và COD làm tròn lên
        500.000, version cài đặt): phí báo là phí của mức đã làm tròn. Không tên, SĐT, địa chỉ chi tiết.
      x-auth: service_key
      x-permission: web.shipping.quote
      x-idempotency: exempt
      x-idempotency-reason: "Chỉ báo phí từ thân yêu cầu, không ghi dữ liệu"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebShippingQuoteRequest"
      responses:
        "200":
          description: Các lựa chọn giao hàng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebShippingQuote"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/shipping/estimates:
    get:
      operationId: webDeliveryEstimates
      summary: Số ngày giao dự kiến theo tỉnh (trung vị 60 ngày, tỉnh đủ 20 vận đơn); hạn sống 1 giờ
      description: |
        Task 198 (M5-15). Trung vị số ngày từ lúc hãng lấy hàng tới lúc giao của vận đơn giao trong 60 ngày, theo mã
        tỉnh của địa chỉ giao, làm tròn 0,1 ngày; tỉnh có ít hơn 20 vận đơn không có trong danh sách (website tự hiện
        câu chung).
      x-auth: service_key
      x-permission: web.shipping.quote
      responses:
        "200":
          description: Ước thời gian giao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebDeliveryEstimates"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/intake:
    get:
      operationId: webIntakeStatus
      summary: Shop có đang tạm dừng nhận đơn web không (không lý do, người, giờ); hạn sống 5 s
      description: |
        Task 456 (M5-44). Website hiện "ELIMAZ đang tạm dừng nhận đơn trên website…" khi paused. Bộ đệm 5 s, làm mới
        sớm hơn theo sự kiện order.web_intake.changed. Chỉ để hiện; tạo đơn luôn kiểm lại ở CRM (503 web_orders_paused).
      x-auth: service_key
      x-permission: web.catalog.read
      responses:
        "200":
          description: Trạng thái nhận đơn web
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebIntakeStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/files:
    post:
      operationId: webUploadRequestFile
      summary: Website gửi một ảnh khách kèm yêu cầu về đơn (JPEG, PNG, WebP ≤ 6 MiB); CRM giữ riêng tư (Task 195, R10)
      description: |
        Thân là nguyên byte ảnh, Content-Type là loại ảnh. CRM không tự kiểm nội dung: ảnh thô vào crm-tmp (tự xóa sau
        24 giờ), lệnh file.process_private của M1 kiểm bằng imager và ghi biến thể vào bucket riêng tư. Loại ngoài
        JPEG, PNG, WebP → 422 file_type_not_allowed; lớn hơn 6 MiB → 413 body_too_large; Content-Type không phải ảnh →
        415. Tệp không phải ảnh hợp lệ thành rejected sau khi xử lý: webCreateRequest kèm tệp đó → 422 file_rejected.
        Kho tệp lỗi → 503 retry_later, không lưu.
      x-auth: service_key
      x-permission: web.requests.write
      x-body-limit: 6291456
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Ảnh đã nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRequestFile"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/flash-sales/current:
    get:
      operationId: webFlashCurrent
      summary: Đợt flash sale đã lên lịch hay đang mở còn hạn, kèm số suất còn trống từng món (Task 204, M5-21)
      description: |
        serverTime là giờ của CRM để website đếm ngược tới startsAt. status là trạng thái hiệu lực: scheduled trước giờ
        mở, open từ giờ mở tới endsAt (đợt đã quá endsAt không trả). Phần tĩnh (đợt, món, giá) đệm 2 s và làm mới theo
        báo hiệu flash_sale, flash_item. remaining là số suất còn trống (không tính suất đang giữ cho đơn nháp hay đã
        bán), lấy từ trạng thái của cổng flash sale (vòng dựng lại mỗi 2 s từ PostgreSQL); cổng không biết thì đếm ở
        PostgreSQL. soldOut = remaining 0. Chỉ để hiện: lượt mua luôn chốt ở CRM.
      x-auth: service_key
      x-permission: web.catalog.read
      responses:
        "200":
          description: Các đợt theo giờ mở tăng dần, món theo mã tăng dần
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebFlashCurrent"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/flash-orders/{externalRef}/complete:
    post:
      operationId: webFlashComplete
      summary: Khách hoàn tất đơn nháp flash sale trong hạn giữ suất (Task 204, M5-21)
      description: |
        Đơn nháp của lượt mua (externalRef của lượt mua) thành đơn new (COD, không mã giảm): ghi địa chỉ, phí ship, lựa
        chọn giao hàng (cùng dạng đơn web, đối chiếu như webCreateOrder), ghi chú; suất đang giữ thành đã bán. phone phải
        là SĐT của khách đã mua (SĐT khác, mã không có, không phải đơn flash → 404 not_found, không lộ đơn có tồn tại).
        Quá hạn giữ → đơn bị hủy (suất trả lại đợt) và 422 hold_expired. Đơn đã hoàn tất → trả lại kết quả (200). Lưu
        theo khóa: 200, 422 hold_expired. Không lưu: 404, 400 (phone_required, invalid_input), 422 địa chỉ, giao hàng,
        503.
      x-auth: service_key
      x-permission: web.flash.buy
      parameters:
        - $ref: "#/components/parameters/ExternalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFlashCompleteRequest"
      responses:
        "200":
          description: Đơn đã hoàn tất
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebFlashCompleted"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/flash-sales/{saleId}/items/{itemId}/buy:
    post:
      operationId: webFlashBuy
      summary: Khách bấm mua một món flash sale (Task 203, M5-20); bốn lớp chắn trước khi chạm database
      description: |
        Thứ tự: khóa dịch vụ → giới hạn của khóa → cổng nhận vào flash (giới hạn theo SĐT 10 lượt/10 s và theo IP 30/10 s
        → 429 too_fast kèm Retry-After; X-Attempt ≤ 1 và cờ hết suất bật → 200 {result: sold_out} không lưu, không
        chạm database; bộ điều tiết theo món và theo shop từ chối → 503 retry_later kèm Retry-After) → khóa chống trùng →
        transaction mua (order.BuyFlash). Từ X-Attempt 2 (website gửi lại cùng Idempotency-Key khi mất câu trả lời) bỏ
        qua cờ hết suất để trả lại kết quả đã lưu (QĐ21). Lưu theo khóa: 200 bought (code, externalRef, expiresAt),
        sold_out, over_limit, not_open. Không lưu: 400 phone_required (thiếu hay sai SĐT), 400 bad_request (thân sai,
        clientIp sai, X-Attempt ngoài 1–10), 429, 503 (cổng, suất đang bị lượt khác khóa, database tạm bận), 404 (món
        không có hay không thuộc đợt). Khách mới tạo tên "Khách website", SĐT là danh tính, nguồn web.
      x-auth: service_key
      x-permission: web.flash.buy
      x-admission: flash
      x-body-limit: 2048
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: saleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Attempt
          in: header
          required: false
          description: Lần gửi của cùng Idempotency-Key (1–10, mặc định 1)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFlashBuyRequest"
      responses:
        "200":
          description: Kết quả cuối của lượt mua (bought, sold_out, over_limit, not_open)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebFlashBuyResult"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/orders/changes:
    get:
      operationId: webOrderChanges
      summary: Đơn web đổi trạng thái (đơn hay vận đơn hiện hành) sau một mốc, keyset (changedAt, id) tăng dần (Task 196)
      description: |
        changedAt là lúc muộn hơn của lần đổi đơn và lần đổi trạng thái vận đơn hiện hành. Trả đơn có (changedAt, id) >
        (since, afterId) — afterId bỏ trống là lấy cả đơn đúng mốc since. hasMore = true thì gọi tiếp ngay với
        nextSince, nextAfterId; hết thì lần sau gọi với nextSince lùi 30 s (đơn ghi chậm) — đơn có thể lặp lại, website
        ghi đè theo externalRef. since sai định dạng, limit ngoài 1–500 → 400 bad_request.
      x-auth: service_key
      x-permission: web.orders.read
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: afterId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: webOrderChanges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebOrderChanges"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/orders/{externalRef}:
    get:
      operationId: webGetOrder
      summary: Khách tra đơn web của mình theo externalRef (Task 196); không có địa chỉ, SĐT, tên, ghi chú nội bộ
      description: |
        Chỉ đơn kênh web; đơn nhập tay, đơn của shop khác → 404 not_found. displayStatus là nhãn gộp (OrderLabel) đã bỏ
        các nhãn chỉ nội bộ (nháp, chờ duyệt giảm, chờ khách, hết hàng → new). deliveredAt, exchangeUntil,
        lines[].exchangeableQty cho nút "Yêu cầu đổi hàng" (exchangeableQty = 0 khi đơn chưa giao hay đã quá hạn).
      x-auth: service_key
      x-permission: web.orders.read
      parameters:
        - $ref: "#/components/parameters/ExternalRef"
      responses:
        "200":
          description: webGetOrder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebOrderView"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/orders/{externalRef}/cancel:
    post:
      operationId: webCancelOrder
      summary: Khách hủy đơn web — hủy ngay khi chưa gửi hãng, không thì tạo yêu cầu hủy cho nhân viên (Task 196, QĐ18)
      description: |
        Khóa dòng đơn trước (cùng khóa với Gửi hãng), nên tranh với Gửi hãng chỉ một bên thắng. Đơn new, confirmed chưa
        có vận đơn hiện hành → hủy (nhả hàng, trả lượt mã), 200 {cancelled: true}. Đã có vận đơn hay đang yêu cầu hãng
        hủy → yêu cầu hủy (đã có yêu cầu hủy đang mở thì trả lại mã đó), 200 {cancelled: false, requestRef}. Đơn đã
        giao, đã hoàn, đã hủy → 422 cannot_cancel. Lời nhắn tối đa 500 ký tự. Kết quả 200 lưu theo khóa; từ chối không
        lưu.
      x-auth: service_key
      x-permission: web.orders.cancel
      parameters:
        - $ref: "#/components/parameters/ExternalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebCancelOrderBody"
      responses:
        "200":
          description: Kết quả hủy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCancelOutcome"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/web/orders/{externalRef}/requests:
    get:
      operationId: webListRequests
      summary: Yêu cầu về đơn của một đơn web (mới trước), kèm tin nhân viên gửi khách; không có ghi chú nội bộ (Task 195)
      x-auth: service_key
      x-permission: web.orders.read
      parameters:
        - $ref: "#/components/parameters/ExternalRef"
      responses:
        "200":
          description: webListRequests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCustomerRequestList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: webCreateRequest
      summary: Khách gửi yêu cầu hủy, đổi, trả hay câu hỏi cho đơn web (Task 195)
      description: |
        Đổi, trả: đơn đã giao trong exchangeWindowDays ngày (mặc định 7; quá → 422 window_closed, chưa giao → 422
        request_not_allowed), số ≤ số đã mua trừ số đang trong yêu cầu đổi khác (→ 422 qty_exceeded), dòng DEFECT,
        WRONG_ITEM cần ít nhất một ảnh (→ 422 photo_required). Hủy: đơn new, confirmed,
        cancel_requested, mỗi đơn một yêu cầu hủy đang mở
        (→ 422 duplicate_open). Ảnh: tối đa 5 (→ 422 too_many_files), mã từ webUploadRequestFile chưa gắn yêu cầu khác
        (→ 422 file_not_found), imager từ chối (→ 422 file_rejected). Quá 5 yêu cầu một đơn trong 24 giờ → 429
        too_fast. Từ chối không lưu theo khóa.
      x-auth: service_key
      x-permission: web.requests.write
      parameters:
        - $ref: "#/components/parameters/ExternalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebCreateRequestBody"
      responses:
        "201":
          description: Yêu cầu đã nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebRequestRef"
        "503":
          $ref: "#/components/responses/RetryLater"
        default:
          $ref: "#/components/responses/Error"
