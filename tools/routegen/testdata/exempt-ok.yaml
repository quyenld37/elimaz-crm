openapi: 3.0.3
info: {title: t, version: "1"}
paths:
  /api/v1/quote:
    post:
      operationId: quoteCart
      x-permission: things.read
      x-idempotency: exempt
      x-idempotency-reason: "  Chỉ tính giá từ thân yêu cầu, không ghi dữ liệu  "
      responses: {"200": {description: ok}}
  /api/v1/things:
    post:
      operationId: createThing
      x-permission: things.write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: {"200": {description: ok}}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string}
