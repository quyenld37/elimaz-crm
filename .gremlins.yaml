# Mutation testing vùng rủi ro cao (kế hoạch M0 bản 5, Task 23; ADR-25, ADR-44). Chạy: make mutation.
# Danh sách thư mục: Makefile đọc thẳng HIGH_RISK_DIRS của hook (một nguồn, Task 392); với internal/httpapi chỉ
# đột biến guard.go. Kết quả từng lượt và lý do mỗi đột biến còn sống: docs/mutation.md.
# Vùng cao M4 (kế hoạch M4, Task 182) chưa nằm trong HIGH_RISK_DIRS (tệp của hook, chỉ chủ shop sửa): chạy riêng từng
# gói bằng `gremlins unleash --config .gremlins.yaml [-E '/' -E '^<tệp loại>\.go$' …] ./<gói>` cho
# internal/modules/channel, internal/adapters/facebook/{signature,policy,send,download}.go,
# internal/modules/conversation/internal/{inbound,send,automation,live,access}; cách chạy trên GitHub Actions và kết
# quả: docs/mutation.md, mục "Lần chạy M4".
unleash:
  # Hiệu quả của bộ test (đột biến bị giết / (bị giết + còn sống)) phải từ 80% trở lên.
  threshold:
    efficacy: 80
  # Test của các gói này chạy trên PostgreSQL thật; nhiều lượt song song làm máy dev quá tải và test nhạy thời gian đỏ
  # sai (kết quả TIMED OUT không tính vào hiệu quả nhưng làm lượt chạy dài).
  workers: 2
  timeout-coefficient: 10
mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-negatives:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
