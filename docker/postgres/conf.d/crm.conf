# Cấu hình CRM nạp qua include_dir (docker/postgres/initdb/000-crm-conf.sh). ADR-37, ADR-42.
archive_mode = on
archive_command = 'wal-g wal-push %p'
# ADR-37 điều 1: không quá 5 phút. 60 s cho RPO khoảng một phút.
archive_timeout = 60
shared_preload_libraries = 'pg_stat_statements'
max_connections = 100
