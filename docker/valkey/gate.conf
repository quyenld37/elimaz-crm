# Valkey bộ đếm và cờ (giới hạn tần suất, cổng điều tiết flash sale; ADR-39, 40, kế hoạch M5 Task 184): không tự xóa
# khóa (đầy thì lệnh ghi lỗi, cầu dao của platform/cache chuyển sang đường dự phòng), ghi đĩa mỗi giây. Người dùng ACL
# crm_gate. maxmemory 128mb là trần; compose dev đặt mem_limit 192m cho container.
port 6379
protected-mode yes
maxmemory 128mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
dir /data
aclfile /etc/valkey/users.acl
