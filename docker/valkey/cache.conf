# Valkey bộ đệm đọc của website (ADR-39, kế hoạch M5 Task 184): đầy thì tự xóa khóa ít dùng, không ghi đĩa; mất sạch
# chỉ làm chậm (API đọc lại PostgreSQL). Chỉ module platform/cache nối tới, bằng người dùng ACL crm_cache.
# maxmemory 256mb là trần, không phải mức chiếm sẵn (dev chỉ dùng vài MB); compose dev đặt mem_limit 320m cho container.
port 6379
protected-mode yes
maxmemory 256mb
maxmemory-policy allkeys-lru
save ""
appendonly no
aclfile /etc/valkey/users.acl
