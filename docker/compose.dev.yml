# Hạ tầng dev của CRM (kế hoạch M0 bản 5, Task 1; mọi dịch vụ dev của M1 thêm một lần ở Task M1-40). Image ghim
# theo digest. Cổng đọc từ biến môi trường để nhiều phiên chạy song song trên một máy; mặc định đúng cổng của kế
# hoạch: PostgreSQL 5442, Jaeger UI 16686, OTLP 4318, SeaweedFS 8333, kho ngoài giả 8334, imager 4193, fakecarrier 4194,
# devaccess 4195.
#   docker compose -f docker/compose.dev.yml up -d --wait
#   CRM_PG_PORT=5452 CRM_S3_PORT=8440 docker compose -p crm-khac -f docker/compose.dev.yml up -d --wait
# imager, fakecarrier, filesync, devaccess chỉ chạy khi bật profile cùng tên (mã của chúng có ở Task M1-42, M1-31,
# M1-45, 395); `make dev` tự bật imager, fakecarrier, filesync nếu đã có Dockerfile; devaccess do make demo-mot-don bật.
# Kịch bản "một đơn đi trọn" trên compose (Task 395): `make demo-mot-don` (RUNBOOK, mục "Chạy lát mỏng").
name: crm

# Phần chung của dịch vụ ứng dụng (Task 21). Gộp bằng `<<:`; tests/deploy đọc kết quả đã gộp.
x-crm-env: &crm-env
  CRM_ENV: dev
  DATABASE_URL: postgres://crm_app:crm_app_dev@postgres:5432/crm?sslmode=disable
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
x-crm-s3: &crm-s3
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY_ID: crm-app-dev
  S3_SECRET_ACCESS_KEY: crm-app-dev-only-not-a-secret
  FILES_PUBLIC_BASE_URL: http://127.0.0.1:${CRM_S3_PORT:-8333}/crm-public
# Hãng giả (Task 395): chỉ nối khi lệnh chạy đặt CRM_FAKECARRIER_SECRET (make demo-mot-don sinh mỗi lần chạy, không
# lưu tệp). Không đặt (make app-up, image-check) thì các biến rỗng: ingest, worker không nối hãng giả, như trước.
x-crm-fakecarrier: &crm-fakecarrier
  FAKECARRIER_URL: ${CRM_FAKECARRIER_SECRET:+http://fakecarrier:4194}
  FAKECARRIER_WEBHOOK_SECRET: ${CRM_FAKECARRIER_SECRET:-}
x-crm-hardening: &crm-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
x-crm-health: &crm-health
  healthcheck:
    test: ["CMD", "/crm", "healthcheck"]
    interval: 5s
    timeout: 5s
    start_period: 20s
    retries: 6

services:
  postgres:
    # postgres:18 (18.7), digest của image index đa nền tảng, lấy ngày 18/11/2026
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "127.0.0.1:${CRM_PG_PORT:-5442}:5432"
    shm_size: 256mb
    # tini làm PID 1 (như production, Task 21): healthcheck pg_isready và `docker compose exec postgres psql` (make
    # demo-mot-don) chạy bằng exec; tiến trình mồ côi rơi về postmaster, thoát mã khác 0 (pg_isready quá hạn lúc máy
    # tải nặng) thì postmaster coi là sập và khởi động lại cả cụm (đo 18/11/2026, Task 395).
    init: true
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    # jaegertracing/jaeger:2.23.0 (Jaeger v2), digest lấy ngày 18/11/2026
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:${CRM_JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${CRM_OTLP_PORT:-4318}:4318"

  # Kho tệp chính (ADR-36). Khóa dev cố định trong seaweedfs/s3.json, chỉ cho máy dev.
  seaweedfs:
    image: &seaweedfs chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # -ip.bind=0.0.0.0: có hai mạng (default, imaging) thì weed chỉ nghe trên IP tự chọn, cổng mở ra máy không tới.
    # -s3.allowedOrigins là CORS chung cho bucket không có CORS riêng (mặc định "*"): đặt một gốc không tồn tại để chỉ
    # crm-tmp (CORS riêng do bootstrap.sh đặt từ CONSOLE_ORIGINS) nhận tải thẳng từ trình duyệt.
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
      "-s3.allowedOrigins=https://khong-cho-phep.invalid", "-master.volumeSizeLimitMB=64"]
    ports:
      - "127.0.0.1:${CRM_S3_PORT:-8333}:8333"
    volumes:
      - seaweed:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [default, imaging]
    healthcheck: &weedhealth
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Kho ngoài giả (thay Backblaze B2 ở dev, Task M1-45, M1-46): chỉ crm-filesync ghi, không ai xóa được.
  seaweedfs-offsite:
    image: *seaweedfs
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
      "-master.volumeSizeLimitMB=64"]
    ports:
      - "127.0.0.1:${CRM_S3_OFFSITE_PORT:-8334}:8333"
    volumes:
      - seaweed-offsite:/data
      - ./seaweedfs/s3-offsite.json:/etc/seaweedfs/s3.json:ro
    healthcheck: *weedhealth

  # Tạo bucket, giữ phiên bản, chính sách, hạn, CORS cho cả hai kho (chạy lại không lỗi), rồi ngồi chờ: container đã
  # thoát làm `up --wait` báo lỗi, nên "xong" là healthcheck thấy /tmp/xong. Chạy lại: docker compose restart s3-bootstrap.
  s3-bootstrap:
    image: *seaweedfs
    entrypoint: ["sh", "-ec"]
    command:
      - |
        rm -f /tmp/xong
        /opt/bootstrap.sh main http://seaweedfs:8333 /etc/seaweedfs/s3.json
        /opt/bootstrap.sh offsite http://seaweedfs-offsite:8333 /etc/seaweedfs/s3-offsite.json
        touch /tmp/xong
        exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/xong"]
      interval: 1s
      timeout: 2s
      retries: 120
    init: true
    environment:
      CONSOLE_ORIGINS: ${CONSOLE_ORIGINS:-http://localhost:4192}
    volumes:
      - ./seaweedfs/bootstrap.sh:/opt/bootstrap.sh:ro
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweedfs/s3-offsite.json:/etc/seaweedfs/s3-offsite.json:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
      seaweedfs-offsite:
        condition: service_healthy

  # Giải mã ảnh (ADR-45, Task M1-42). Không biến bí mật, không database; chỉ mạng `imaging` (internal) với kho tệp.
  # Không mở cổng: Docker bỏ cổng mở của container chỉ nằm trên mạng internal; cổng ra máy qua imager-port.
  imager:
    profiles: [imager]
    build:
      context: ..
      dockerfile: docker/imager/Dockerfile
    image: crm-imager:dev
    environment:
      PORT: "4193"
      IMAGER_MAX_PARALLEL: "2"
      IMAGER_STEP_TIMEOUT: 10s
      IMAGER_STEP_MEMORY: "1073741824"
    networks: [imaging]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Chuyển cổng 127.0.0.1:4193 của máy tới imager:4193 cho worker dev chạy trên máy (Task M1-42, Q1 của task-42.md).
  # Chỉ chuyển đúng một đích; imager gọi tới đây chỉ quay về chính nó. Production không có dịch vụ này (worker nằm
  # trong mạng imaging).
  imager-port:
    profiles: [imager]
    # alpine/socat:1.8.0.3, digest lấy ngày 18/11/2026; chỉ dev
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:4193,fork,reuseaddr", "TCP:imager:4193"]
    ports:
      - "127.0.0.1:${CRM_IMAGER_PORT:-4193}:4193"
    networks: [default, imaging]
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [imager]

  # ---- Ba vai trò của image chính (Task 21), profile `app`: `make db-up` không bật chúng. Dựng image và chạy:
  #   make image && make app-up      (hoặc scripts/ops/image-check.sh kiểm cả đường)
  # Bí mật ở đây là chuỗi giả chỉ cho máy dev (0123456789abcdef… được .gitleaks.toml cho phép).
  # Giới hạn bộ nhớ chưa có số đo (đo ở Task 22); GOMEMLIMIT = 90% giới hạn, làm tròn xuống MiB (tests/deploy).
  # stop_grace_period 30 s: worker chờ việc đang chạy tối đa 25 s (Task 11), Docker giết sau hạn này.
  crm-migrate:
    profiles: [app]
    image: ${CRM_IMAGE:-crm:dev}
    environment:
      <<: *crm-env
      CRM_ROLE: migrate
      DATABASE_OWNER_URL: postgres://crm_owner:crm_owner_dev@postgres:5432/crm?sslmode=disable
    restart: "no"
    <<: *crm-hardening
    depends_on:
      postgres:
        condition: service_healthy

  crm-ingest:
    profiles: [app]
    image: ${CRM_IMAGE:-crm:dev}
    environment:
      <<: [*crm-env, *crm-fakecarrier]
      CRM_ROLE: ingest
      PORT: "4191"
      SPOOL_DIR: /var/spool/crm
      SELFTEST_WEBHOOK_SECRET: dev-0123456789abcdef0123456789abcdef
      GOMEMLIMIT: 230MiB
    ports:
      - "127.0.0.1:${CRM_INGEST_PORT:-4191}:4191"
    volumes:
      - spool:/var/spool/crm
    mem_limit: 256m
    <<: [*crm-hardening, *crm-health]
    depends_on: &crm-deps
      postgres:
        condition: service_healthy

  crm-api:
    profiles: [app]
    image: ${CRM_IMAGE:-crm:dev}
    environment:
      <<: [*crm-env, *crm-s3]
      CRM_ROLE: api
      PORT: "4190"
      # Máy chủ thẻ Access giả (profile devaccess, Task 395); api tin chứng chỉ tự ký của nó qua SSL_CERT_DIR (Go đọc
      # thêm mọi chứng chỉ trong thư mục, vẫn giữ bộ CA của image). Không bật devaccess thì không thẻ nào qua.
      ACCESS_TEAM_DOMAIN: devaccess:8443
      SSL_CERT_DIR: /etc/ssl/devaccess
      ACCESS_AUD: dev-aud
      ACCESS_MFA_CLAIM: amr
      ACCESS_MFA_VALUES: mfa
      CONSOLE_ORIGINS: ${CONSOLE_ORIGINS:-http://localhost:4192}
      HEALTH_TOKEN: dev-0123456789abcdef0123456789abcdef
      GOMEMLIMIT: 460MiB
    ports:
      - "127.0.0.1:${CRM_API_PORT:-4190}:4190"
    volumes:
      - devaccess-ca:/etc/ssl/devaccess:ro
    mem_limit: 512m
    <<: [*crm-hardening, *crm-health]
    depends_on: *crm-deps

  crm-worker:
    profiles: [app]
    image: ${CRM_IMAGE:-crm:dev}
    environment:
      <<: [*crm-env, *crm-s3, *crm-fakecarrier]
      CRM_ROLE: worker
      IMAGER_URL: http://imager:4193
      S3_IMAGER_ENDPOINT: http://seaweedfs:8333
      GOMEMLIMIT: 460MiB
    # imaging: tới imager (chỉ chạy khi bật profile imager) và kho tệp theo đúng tên imager dùng.
    networks: [default, imaging]
    mem_limit: 512m
    <<: [*crm-hardening, *crm-health]
    depends_on: *crm-deps

  # Hãng vận chuyển giả (Task M1-31), chỉ dev và staging. Trang /admin không xác thực: chỉ mở 127.0.0.1.
  # Webhook về crm-ingest trong mạng compose, cùng khóa với ingest, worker (Task 395; rỗng: không gửi webhook).
  fakecarrier:
    profiles: [fakecarrier]
    build:
      context: ..
      dockerfile: tools/fakecarrier/Dockerfile
    image: crm-fakecarrier:dev
    environment:
      FAKECARRIER_WEBHOOK_URL: ${CRM_FAKECARRIER_SECRET:+http://crm-ingest:4191/hooks/fakecarrier}
      FAKECARRIER_WEBHOOK_SECRET: ${CRM_FAKECARRIER_SECRET:-}
      # Kiện giữ trong volume: dựng lại container (khóa mới mỗi lần chạy) không làm mã hãng quay về FC00000001.
      FAKECARRIER_DATA: /data/fakecarrier.json
    ports:
      - "127.0.0.1:${CRM_FAKECARRIER_PORT:-4194}:4194"
    volumes:
      - fakecarrier-data:/data

  # Máy chủ thẻ Cloudflare Access giả (Task 395), chỉ compose dev: bộ khóa HTTPS ở devaccess:8443 (chỉ trong mạng
  # compose) cho crm-api; phát thẻ GET /token?email=… ở cổng 4195, chỉ mở 127.0.0.1. Khóa và chứng chỉ sinh ở lần
  # chạy đầu, giữ trong volume devaccess-data của dự án compose; devaccess-ca chỉ có chứng chỉ công khai.
  devaccess:
    profiles: [devaccess]
    build:
      context: ..
      dockerfile: tools/devaccess/Dockerfile
    image: crm-devaccess:dev
    environment:
      CRM_ENV: dev
      ACCESS_AUD: dev-aud
      ACCESS_MFA_CLAIM: amr
    ports:
      - "127.0.0.1:${CRM_DEVACCESS_PORT:-4195}:4195"
    volumes:
      - devaccess-data:/data
      - devaccess-ca:/ca
    healthcheck:
      test: ["CMD", "/devaccess", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Chép kho chính sang kho ngoài giả mỗi giờ (Task M1-45), danh tính crm-filesync.
  filesync:
    profiles: [filesync]
    build:
      context: ..
      dockerfile: docker/filesync/Dockerfile
    image: crm-filesync:dev
    depends_on:
      s3-bootstrap:
        condition: service_healthy

networks:
  # Mạng riêng của imager: chỉ imager, kho tệp chính, imager-port (và worker khi worker chạy trong compose).
  # `internal: true` (Task M1-42): mạng bridge thường có gateway, và trên Docker 29 của máy dev container ở mạng này
  # nối được PostgreSQL theo IP của mạng default qua gateway (đo 18/11/2026, task-42.md Q1); internal thì không có
  # gateway, imager không ra internet, không tới mạng khác. Compose production làm đúng như vậy.
  imaging:
    internal: true

volumes:
  pgdata:
  seaweed:
  seaweed-offsite:
  spool:
  devaccess-data:
  devaccess-ca:
  fakecarrier-data:
