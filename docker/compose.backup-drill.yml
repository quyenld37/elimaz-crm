# Compose diễn tập sao lưu và khôi phục (kế hoạch M0 bản 5, Task 2). Chỉ chạy qua scripts/backup/*.sh.
# SeaweedFS ở đây chỉ thay cho kho ngoài thật (ADR-37 điều 4: sao lưu thật đi thẳng ra kho ngoài, không qua SeaweedFS).
# Mọi khóa sinh lúc chạy (scripts/backup/drill-lib.sh), không ghi vào repo.
name: crm-t02

x-walg-env: &walg-env
  WALG_S3_PREFIX: s3://crm-backup/pg
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?sinh bằng scripts/backup/drill-lib.sh}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?sinh bằng scripts/backup/drill-lib.sh}
  AWS_ENDPOINT: http://seaweedfs:8333
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
  WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?sinh bằng scripts/backup/drill-lib.sh}
  WALG_LIBSODIUM_KEY_TRANSFORM: hex
  PGHOST: /var/run/postgresql
  PGUSER: postgres

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=64"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
    # Cổng 8333 chỉ trong mạng của compose: cổng 8333 của máy đang bị dự án khác giữ (task-02.md, quyết định 5).
    expose: ["8333"]
    volumes:
      - seaweed:/data

  postgres:
    build:
      context: ./postgres
    image: crm-postgres:18-walg-drill
    shm_size: 256mb
    environment:
      <<: *walg-env
      POSTGRES_PASSWORD: ${CRM_DRILL_PG_PASSWORD:?sinh bằng scripts/backup/drill-lib.sh}
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:${CRM_DRILL_PG_PORT:-5452}:5432"
    volumes:
      # Image bản 18: PGDATA=/var/lib/postgresql/18/docker, nên gắn volume ở /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./postgres/init-drill/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ../scripts/backup:/opt/crm-backup:ro
    depends_on:
      - seaweedfs

  # Máy mới rỗng: tải bản sao lưu mới nhất, phát lại WAL tới hết, rồi nhận ghi. Không đẩy WAL lên kho.
  pg-restore:
    profiles: [restore]
    image: crm-postgres:18-walg-drill
    user: postgres
    shm_size: 256mb
    environment:
      <<: *walg-env
    entrypoint: ["bash", "-ec"]
    command:
      - |
        mkdir -p "$$PGDATA"
        chmod 700 "$$PGDATA"
        wal-g backup-fetch "$$PGDATA" LATEST
        touch "$$PGDATA/recovery.signal"
        exec postgres -c restore_command='wal-g wal-fetch %f %p' -c recovery_target_timeline=latest -c archive_mode=off
    volumes:
      - pgrestore:/var/lib/postgresql
    depends_on:
      - seaweedfs

  # Công cụ tải object của bucket về để kiểm mã hóa.
  rclone:
    profiles: [tools]
    image: rclone/rclone:1.74.4@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: SeaweedFS
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      RCLONE_CONFIG_S3_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_S3_REGION: us-east-1
    depends_on:
      - seaweedfs

volumes:
  pgdata:
  pgrestore:
  seaweed:
