# gitleaks 8.x: luật mặc định cộng vài ngoại lệ có lý do. Chạy trong `make ci` (cả lịch sử git lẫn thư mục làm việc).
[extend]
useDefault = true

[allowlist]
description = "Chuỗi giả có chủ ý"
paths = [
  # Ví dụ "ĐỪNG làm" trong tài liệu skill đã đọc và ghim ở Task 0.
  '''^\.claude/skills/.+\.md$''',
  # Bản sao repo của các task đang chạy song song (git worktree, đã nằm trong .gitignore); mỗi bản tự quét khi chạy make ci của nó.
  '''^\.worktrees/''',
]
regexes = [
  # Bí mật giả 32 ký tự dùng trong test (config, e2e).
  '''0123456789abcdef0123456789abcdef''',
  # Tên tệp log theo ngày trong test (api-2026-11-18.log) bị nhận nhầm là khóa API.
  '''[a-z]+-\d{4}-\d{2}-\d{2}\.log''',
  # Token giả của test bộ che dữ liệu cá nhân (Task 319): JWT có payload {"sub":"123"}, chữ ký "signature123";
  # phần đầu JWT đứng riêng; khóa mẫu công khai trong tài liệu Stripe.
  '''^eyJhbGciOiJIUzI1NiJ9(\.eyJzdWIiOiIxMjMifQ\.c2lnbmF0dXJlMTIz)?$''',
  '''^(sk_live_)?4eC39HqLyjWDarjtT1zdp7dc$''',
]
